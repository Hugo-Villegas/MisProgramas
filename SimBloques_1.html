<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SimBloques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Concepto: banco de trabajo de ingeniería — paneles laterales sobrios, lienzo con grilla de plano, acento petróleo */
:root {
  --bg: #e7ecef; --surface: #f6f8f9; --panel: #ffffff; --ink: #16212b; --muted: #586774; --line: #c6d0d8; --line-soft: #dde4e9;
  --accent: #0c6780; --accent-ink: #ffffff; --accent-soft: #d5e9f0; --warn: #a14a06; --danger: #b42318; --ok: #2b7a4b;
  --blk-fill: #ffffff; --blk-stroke: #34444f; --nofail: #edf1f4; --grid: #d5dde3; --sel: #0c6780; --shadow: 0 10px 30px rgba(22, 33, 43, .18);
  --s0: #0c6780; --s1: #c2410c; --s2: #4d7c0f; --s3: #7c3aed; --s4: #a16207; --s5: #be185d;
  /* Cada sistema cae en su propia fuente nativa si las de Google no cargan */
  --f-display: "Archivo", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317; --surface: #141b21; --panel: #19222a; --ink: #e1e8ed; --muted: #94a2ad; --line: #2d3944; --line-soft: #222c35;
    --accent: #58b6cf; --accent-ink: #061217; --accent-soft: #12313c; --warn: #f0a33a; --danger: #f87171; --ok: #57d18a;
    --blk-fill: #1e2831; --blk-stroke: #a6b6c2; --nofail: #172029; --grid: #212b34; --sel: #58b6cf; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --s0: #58b6cf; --s1: #fb923c; --s2: #a3e635; --s3: #c4b5fd; --s4: #facc15; --s5: #f472b6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #141b21; --panel: #19222a; --ink: #e1e8ed; --muted: #94a2ad; --line: #2d3944; --line-soft: #222c35;
  --accent: #58b6cf; --accent-ink: #061217; --accent-soft: #12313c; --warn: #f0a33a; --danger: #f87171; --ok: #57d18a;
  --blk-fill: #1e2831; --blk-stroke: #a6b6c2; --nofail: #172029; --grid: #212b34; --sel: #58b6cf; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --s0: #58b6cf; --s1: #fb923c; --s2: #a3e635; --s3: #c4b5fd; --s4: #facc15; --s5: #f472b6; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; padding-inline: 16px; box-sizing: border-box; }
*, *::before, *::after { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
.muted { color: var(--muted); } .small { font-size: 12.5px; } .pad { padding: 16px; } .hint { margin-top: auto; }
.row { display: flex; align-items: center; } .gap { gap: 12px; } .gap-s { gap: 8px; } .wrap { flex-wrap: wrap; } .between { justify-content: space-between; } .grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.warn-text { color: var(--warn); }

/* ---------- Estructura ---------- */
#app { height: 100%; display: grid; grid-template-rows: auto auto minmax(0, 1fr); padding-block: 8px; gap: 6px; }
.topbar { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.brand svg { color: var(--accent); }
#menus { display: flex; gap: 2px; flex-wrap: wrap; }
.menu { position: relative; }
.menu-btn { background: none; border: 0; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
.menu-btn:hover, .menu.open .menu-btn { background: var(--panel); }
.menu-list { display: none; position: absolute; top: 100%; left: 0; z-index: 60; min-width: 270px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 5px; }
.menu.open .menu-list { display: block; }
.ctx-item { display: flex; width: 100%; justify-content: space-between; gap: 20px; background: none; border: 0; text-align: left; padding: 6px 10px; border-radius: 5px; cursor: pointer; }
.ctx-item:hover:not(:disabled) { background: var(--accent-soft); }
.ctx-item:disabled { color: var(--muted); cursor: default; }
.ctx-item.danger { color: var(--danger); }
.ctx-item kbd, .kbd { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.sep { height: 1px; background: var(--line-soft); margin: 4px 2px; }
#ctxmenu { position: fixed; z-index: 90; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 5px; min-width: 230px; }

#toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
.tb-group { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.tb-group.end { margin-left: auto; }
.tb-btn { background: none; border: 0; border-right: 1px solid var(--line-soft); padding: 6px 11px; cursor: pointer; white-space: nowrap; }
.tb-btn:last-child { border-right: 0; }
.tb-btn:hover { background: var(--accent-soft); }
.tb-btn.on { background: var(--accent); color: var(--accent-ink); }
.tb-btn.strong { font-weight: 600; color: var(--accent); }
.tb-btn.accent { color: var(--accent); font-weight: 600; }

.workspace { display: grid; grid-template-columns: 190px minmax(0, 1fr) 200px; gap: 6px; min-height: 0; }
.workspace > * { min-width: 0; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: auto; min-height: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; }
.panel-head h3, .start h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.mini { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; width: 24px; height: 22px; line-height: 1; cursor: pointer; }
.mini:hover { border-color: var(--accent); color: var(--accent); }

/* Plantillas */
.tpl-bars { display: flex; flex-direction: column; gap: 3px; }
.tpl-bar { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; cursor: pointer; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpl-bar.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.tpl-tile { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: grab; text-align: center; user-select: none; }
.tpl-tile:hover { border-color: var(--accent); }
.tpl-tile.sub .tile-ic { color: var(--warn); }
.tile-ic { color: var(--ink); display: grid; place-items: center; height: 28px; }
.tile-name { font-size: 11.5px; line-height: 1.2; word-break: break-word; }
.node-ic { display: grid; place-items: center; width: 26px; height: 26px; border: 1.5px solid var(--blk-stroke); border-radius: 50%; font-family: var(--f-mono); font-size: 12px; }
.tpl-actions { display: flex; gap: 6px; }
.ic { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* Explorador */
.proj-name { font-family: var(--f-display); font-weight: 600; font-size: 14px; line-height: 1.25; word-break: break-word; }
.tree-group { display: flex; flex-direction: column; gap: 2px; }
.tree-title { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
.tree-item { display: flex; align-items: center; gap: 7px; background: none; border: 0; text-align: left; padding: 4px 6px; border-radius: 5px; cursor: pointer; min-width: 0; }
.tree-item:hover { background: var(--panel); }
.tree-item.on { background: var(--accent-soft); font-weight: 600; }
.tree-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--muted); }
.tree-dot.diagram { background: var(--s0); } .tree-dot.plot { background: var(--s1); border-radius: 50%; } .tree-dot.sheet { background: var(--s2); } .tree-dot.template { background: var(--s4); } .tree-dot.manual { background: var(--s3); }

/* Documentos */
.docs { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
#doctabs { display: flex; gap: 2px; background: var(--surface); border-bottom: 1px solid var(--line); overflow-x: auto; flex: none; padding: 4px 4px 0; }
.doctab { display: flex; align-items: center; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; white-space: nowrap; }
.doctab.on { background: var(--panel); border-color: var(--line); margin-bottom: -1px; }
.doctab-name { background: none; border: 0; padding: 6px 4px 6px 10px; cursor: pointer; display: flex; gap: 7px; align-items: center; }
.doctab-x { background: none; border: 0; padding: 4px 9px 4px 4px; color: var(--muted); cursor: pointer; font-size: 15px; }
.doctab-x:hover { color: var(--danger); }
#docview { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Editor de diagramas */
.dg-doc { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.dg-wrap { flex: 1; overflow: auto; min-height: 0; background: var(--panel); touch-action: none; }
.dg-svg { display: block; user-select: none; }
.connecting .dg-svg { cursor: crosshair; }
.dg-banner { background: var(--accent); color: var(--accent-ink); padding: 6px 12px; font-size: 13px; }
.dg-bg { cursor: default; }
.gridline { fill: none; stroke: var(--grid); stroke-width: 1; stroke-dasharray: 3 3; }
.link { fill: none; stroke: var(--blk-stroke); stroke-width: 1.4; }
.link.sel { stroke: var(--sel); stroke-width: 2.6; }
.link-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
.arrowhead { fill: var(--blk-stroke); } .arrowhead.sel { fill: var(--sel); }
.el { cursor: move; }
.el .box { fill: var(--blk-fill); stroke: var(--blk-stroke); stroke-width: 1.5; }
.el.nofail .box { fill: var(--nofail); stroke-dasharray: 4 3; }
.el.sub .box { fill: var(--accent-soft); }
.el.sel .box { stroke: var(--sel); stroke-width: 3; }
.el .ic { color: var(--ink); }
.el.off .box { opacity: .55; }
.xmark { stroke: var(--danger); stroke-width: 3; stroke-linecap: round; }
.lbl { fill: var(--ink); font-size: 12px; text-anchor: middle; font-family: var(--f-body); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.sb-ring { fill: none; stroke: var(--blk-stroke); stroke-width: 1; stroke-dasharray: 3 2; }
.badge-sb rect { fill: var(--warn); }
.badge-fr rect { fill: var(--accent); }
.badge-fr text { fill: var(--accent-ink); font-size: 8px; font-weight: 700; text-anchor: middle; font-family: var(--f-mono); }
.badge-sb text { fill: #fff; font-size: 8px; font-weight: 700; text-anchor: middle; font-family: var(--f-mono); }
.res-chart { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 7px; padding: 6px; }
.node-k { fill: var(--ink); font-family: var(--f-mono); font-size: 12px; text-anchor: middle; }
.badge-opt { fill: var(--ok); stroke: var(--panel); stroke-width: 1.5; }
.badge-fail { fill: var(--warn); }
.badge-rep circle, .badge-st circle { fill: var(--accent); }
.badge-rep text, .badge-st text { fill: var(--accent-ink); font-size: 9px; font-weight: 700; text-anchor: middle; font-family: var(--f-mono); }
.handle { fill: var(--accent); stroke: var(--panel); stroke-width: 2; cursor: crosshair; }
.preview { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; pointer-events: none; }
.preview.rubber { fill: var(--accent-soft); fill-opacity: .4; }
.dg-status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 6px 10px; border-top: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.pill { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; border: 1px solid; }
.pill.edit { color: var(--warn); border-color: var(--warn); }
.pill.ok { color: var(--ok); border-color: var(--ok); }
.st-btns, .st-zoom { display: flex; gap: 4px; }
.st-zoom { margin-left: auto; }
.st-info { font-variant-numeric: tabular-nums; color: var(--muted); }
.st-warn { color: var(--warn); }
.mini-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 9px; cursor: pointer; font-size: 12.5px; }
.mini-btn:hover { border-color: var(--accent); color: var(--accent); }

/* Inicio */
.start { padding: 28px; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 28px; overflow: auto; }
.start h1 { font-size: 34px; letter-spacing: -.01em; }
.lede { font-size: 16px; color: var(--muted); max-width: 52ch; }
.start-main { display: flex; flex-direction: column; gap: 16px; }
.ex-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.ex-item { display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; cursor: pointer; gap: 2px; }
.ex-item:hover { border-color: var(--accent); }
.ex-item span { color: var(--muted); font-size: 13px; }

/* Botones y formularios */
.btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { background: none; border: 0; font-size: 18px; line-height: 1; padding: 2px 6px; cursor: pointer; color: var(--muted); border-radius: 4px; }
.icon-btn:hover { color: var(--danger); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--muted); }
.field.inline { flex-direction: row; align-items: center; gap: 8px; }
input[type=text], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; min-width: 0; width: 100%; }
input[type=text], input[type=number] { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
input:disabled, select:disabled { opacity: .55; }
textarea { font-family: var(--f-body); resize: vertical; }
.check, .radio { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input, .radio input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; flex: none; }
.chk-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; }
.fs { border: 1px solid var(--line-soft); border-radius: 7px; padding: 10px 12px 12px; margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.fs legend { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 0 4px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid2.tight { gap: 6px; }
.two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input.narrow { width: 96px; flex: none; }
.range-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }

/* Modales */
.overlay { position: fixed; inset: 0; background: rgba(10, 18, 24, .45); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); width: min(480px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
.modal.wide { width: min(760px, 100%); } .modal.xwide { width: min(1000px, 100%); }
.m-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
.m-head h2 { font-size: 17px; }
.m-body { padding: 16px; overflow: auto; min-height: 0; }
.m-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 16px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.m-foot .left { margin-right: auto; } .m-foot .left + .left { margin-right: 0; }
.m-foot .left:last-of-type { margin-right: auto; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px; cursor: pointer; color: var(--muted); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.bp-head { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.icon-prev { display: grid; place-items: center; width: 38px; height: 34px; border: 1px solid var(--line); border-radius: 6px; flex: none; }
.dist-editor { display: grid; grid-template-columns: minmax(120px, auto) minmax(0, 1fr); gap: 14px; }
.radio-col { display: flex; flex-direction: column; gap: 5px; }
.radio-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; }
.params { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mix-grid { display: grid; grid-template-columns: auto repeat(3, minmax(0, 1fr)); gap: 5px 6px; align-items: center; }
.mh { font-size: 12px; color: var(--muted); }
.mini-chart { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 7px; min-height: 120px; }
.experimenter { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 7px; padding: 10px; }
.exp-out { display: flex; flex-direction: column; gap: 2px; }
.kv { display: flex; justify-content: space-between; gap: 16px; padding: 3px 0; border-bottom: 1px dotted var(--line-soft); }
.kv b { font-family: var(--f-mono); font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.kv-list { display: flex; flex-direction: column; }
.note { background: var(--accent-soft); border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; }
.sub-prev { display: flex; flex-direction: column; gap: 6px; }
.qcp-out { min-height: 64px; }
.big-result { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; background: var(--accent-soft); border-radius: 8px; padding: 12px 16px; flex-wrap: wrap; }
.big-result b { font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.progress { position: relative; height: 26px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; }
.progress .bar { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, var(--accent-soft) 0 10px, transparent 10px 20px); animation: slide 1s linear infinite; background-size: 28px 28px; }
.progress span { position: relative; font-size: 13px; }
@keyframes slide { to { background-position: 28px 0; } }
@media (prefers-reduced-motion: reduce) { .progress .bar { animation: none; } }
.export-text { width: 100%; min-height: 260px; font-family: var(--f-mono); font-size: 12px; }

/* Tablas */
.tbl-wrap { overflow: auto; max-width: 100%; border: 1px solid var(--line-soft); border-radius: 7px; }
.tbl-wrap.tall { max-height: 340px; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; background: var(--surface); font-weight: 600; font-size: 12px; color: var(--muted); position: sticky; top: 0; }
.tbl th, .tbl td { padding: 5px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
.tbl td { font-variant-numeric: tabular-nums; }
.tbl tr.hl td { background: var(--accent-soft); }
.tbl tr.total td { font-weight: 700; }
.tbl.pick tbody tr { cursor: pointer; }
.tbl.pick tr.on td { background: var(--accent-soft); font-weight: 600; }
.tbl tr.dim td { color: var(--muted); }
.tbl.edit td { padding: 3px 4px; }
.tbl.edit input, .tbl.edit select { padding: 4px 6px; }
.results { display: flex; flex-direction: column; gap: 10px; }
.results h3 { font-size: 14px; margin-top: 6px; }
.expr { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 7px; padding: 8px 12px; max-height: 260px; overflow: auto; white-space: pre; }

/* Gráficos */

<h1>Manual de uso de SimBloques</h1>
<p class="muted">Confiabilidad de sistemas con diagramas de bloques (RBD). Versión 1.0 — equivalente funcional de ReliaSoft BlockSim 1.0, en español y sin instalación.</p>

<h2>1. Qué hace el programa</h2>
<p>SimBloques modela un sistema como un diagrama de bloques de confiabilidad (RBD): cada bloque es un componente con su distribución de vida, y las conexiones indican qué combinaciones de componentes deben funcionar para que el sistema funcione. Con eso el programa:</p>
<ul>
<li>Obtiene la <b>expresión exacta</b> de la confiabilidad del sistema, Rs(t), para configuraciones serie, paralelo, k-de-n, puente y redes complejas.</li>
<li>Calcula R(t), probabilidad de falla, R condicional, tasa de falla, tiempo para una confiabilidad dada, vida BX y MTTF (<b>Calculadora rápida</b>).</li>
<li>Grafica F(t), R(t), pdf, tasa de falla e importancia de cada bloque.</li>
<li>Optimiza la <b>asignación de confiabilidad</b>: qué confiabilidad debe tener cada componente para cumplir una meta del sistema al menor costo.</li>
<li>Simula por Montecarlo la confiabilidad y la <b>disponibilidad</b> con reparaciones (tiempo fuera de servicio, número de fallas).</li>
<li>Ajusta distribuciones a datos de vida por máxima verosimilitud, con suspensiones y datos de intervalo (reemplaza al enlace con Weibull++).</li>
<li>Genera tablas en hojas de cálculo que se copian directo a Excel.</li>
</ul>
<p>Todo corre en el navegador. No se envían datos a ningún servidor; el proyecto se guarda en tu equipo como archivo <code>.sbq.json</code>.</p>
<table>
<tr><th>BlockSim 1.0</th><th>SimBloques</th></tr>
<tr><td>Project (*.rsw)</td><td>Proyecto (<code>.sbq.json</code>)</td></tr>
<tr><td>Template / Template Block</td><td>Plantilla / bloque de plantilla</td></tr>
<tr><td>Diagram Sheet</td><td>Diagrama</td></tr>
<tr><td>Quick Calculation Pad (QCP)</td><td>Calculadora rápida (QCP)</td></tr>
<tr><td>Plot Sheet</td><td>Gráfico</td></tr>
<tr><td>Spreadsheet + Function Wizard</td><td>Hoja de cálculo + Asistente de funciones</td></tr>
<tr><td>Reliability/Maintainability Simulation</td><td>Simulación de confiabilidad / mantenibilidad</td></tr>
<tr><td>Compute Distribution (Weibull++)</td><td>Ajuste de distribución (integrado)</td></tr>
<tr><td>User Setup</td><td>Configuración</td></tr>
</table>

<h2>2. La pantalla de trabajo</h2>
<ul>
<li><b>Barra de menús</b> (Archivo, Editar, Plantilla, Diagrama, Herramientas, Ayuda) y <b>barra de herramientas</b> con los comandos más usados.</li>
<li><b>Panel de plantillas</b> (izquierda): las barras con nombre son las plantillas abiertas; la resaltada es la activa. Debajo están sus bloques, listos para arrastrar al diagrama.</li>
<li><b>Área de documentos</b> (centro): diagramas, gráficos, hojas de cálculo y este manual se abren como pestañas.</li>
<li><b>Explorador</b> (derecha): lista todo lo que contiene el proyecto. Clic para abrir; clic derecho para renombrar, duplicar o eliminar. Un ✓ junto a un diagrama indica que está analizado y sin cambios.</li>
<li><b>Barra de estado del diagrama</b> (abajo del lienzo): estado <i>Edición</i> o <i>Analizado</i>, botones Analizar · QCP · Gráfico · Simular, número de bloques, número de caminos inicio→fin y el zoom.</li>
</ul>
<p class="callout">En pantallas angostas el explorador se oculta o pasa debajo. El programa está pensado para usarse en computador.</p>

<h2>3. Primeros pasos: ejemplo rápido</h2>
<p>Tres resistores en serie con vida exponencial de media 1000, 500 y 333,33 días. Se pide la confiabilidad a 50 días.</p>
<ol class="steps">
<li><b>Archivo › Nuevo proyecto</b>. Se crea un proyecto con una plantilla básica y un diagrama vacío.</li>
<li>En el panel de plantillas pulsa <b>+ Bloque</b>. En la ventana de propiedades escribe el nombre <code>Resistor 1</code>, elige el ícono Resistor, deja marcado <i>El bloque puede fallar</i>, elige <b>Exponencial</b> y escribe Tiempo medio = <code>1000</code>, γ = <code>0</code>. Acepta.</li>
<li>Repite para <code>Resistor 2</code> (500) y <code>Resistor 3</code> (333,33).</li>
<li>Arrastra los tres bloques de la plantilla al diagrama (o haz doble clic sobre cada uno) y ordénalos de izquierda a derecha.</li>
<li>Pulsa <b>Unir</b> (o la tecla <kbd>J</kbd>), arrastra de Resistor 1 a Resistor 2 y de Resistor 2 a Resistor 3. Sal del modo con clic derecho o <kbd>Esc</kbd>.</li>
<li><b>Analizar</b> (<kbd>F5</kbd>) muestra la expresión R1·R2·R3.</li>
<li><b>QCP</b> (<kbd>F6</kbd>) › Probabilidad estándar › tiempo <code>50</code> › Calcular. Resultado: <b>0,7408</b>.</li>
</ol>
<p><button type="button" class="btn small" data-ex="rapido">Cargar el ejemplo rápido ya armado</button></p>

<h2>4. Plantillas y bloques</h2>
<p>Una <b>plantilla</b> es una paleta de bloques reutilizables. Al arrastrar un bloque de plantilla al diagrama se crea una <b>copia independiente</b>: puedes editarla en el diagrama sin cambiar la plantilla, y modificar la plantilla no altera los bloques ya colocados.</p>
<ul>
<li><b>Crear plantilla:</b> botón “+” del panel o Plantilla › Nueva plantilla.</li>
<li><b>Agregar bloques:</b> “+ Bloque” o “+ Nodo” bajo la plantilla.</li>
<li><b>Editar un bloque de plantilla:</b> clic derecho › Editar propiedades.</li>
<li><b>Insertar en el diagrama:</b> arrastrar, doble clic, o seleccionar y <kbd>Enter</kbd>.</li>
<li><b>Exportar / importar</b> (menú Plantilla): guarda la plantilla como <code>.sbqt.json</code>. Si la plantilla contiene bloques de subdiagrama, los diagramas referenciados se exportan con ella.</li>
<li><b>Agregar un diagrama completo a la plantilla:</b> Diagrama › Agregar diagrama a la plantilla. Aparece un bloque con forma de carpeta que representa todo ese sistema (ver sección 7).</li>
</ul>
<p>Desde la barra de herramientas, <b>+ Bloque</b> y <b>+ Nodo</b> agregan un elemento directo al diagrama abierto, sin pasar por la plantilla.</p>

<h2>5. Propiedades del bloque</h2>
<p>Doble clic sobre un bloque (o <kbd>Enter</kbd> con el bloque seleccionado) abre su ventana de propiedades. Arriba van el nombre y el ícono.</p>
<h3>Pestaña Falla</h3>
<ul>
<li><b>El bloque puede fallar.</b> Si se desmarca, R(t) = 1 siempre (bloques de inicio y fin, centros de distribución, etc.). En el diagrama se dibuja con borde punteado.</li>
<li><b>Bloque estático.</b> Confiabilidad fija sin dependencia del tiempo (p. ej. un motor con R = 0,9 para una misión dada). Se marca con una “E”.</li>
<li><b>Distribución de falla</b> y sus parámetros:</li>
</ul>
<div class="tw"><table>
<tr><th>Distribución</th><th>Parámetros</th><th>Confiabilidad R(t)</th></tr>
<tr><td>Weibull (2 o 3 parámetros)</td><td>β forma, η escala, γ ubicación</td><td>exp[−((t−γ)/η)<sup>β</sup>] para t &gt; γ; 1 antes</td></tr>
<tr><td>Exponencial (1 o 2 parámetros)</td><td>Tiempo medio m (o λ = 1/m), γ</td><td>exp[−λ(t−γ)]</td></tr>
<tr><td>Normal</td><td>μ media, σ desviación</td><td>1 − Φ((t−μ)/σ)</td></tr>
<tr><td>Lognormal</td><td>μ′ media de ln t, σ′ desviación de ln t</td><td>1 − Φ((ln t − μ′)/σ′)</td></tr>
<tr><td>Weibull mixta (2, 3 o 4 subpoblaciones)</td><td>βᵢ, ηᵢ, proporción pᵢ (Σpᵢ = 1)</td><td>Σ pᵢ·exp[−(t/ηᵢ)<sup>βᵢ</sup>]</td></tr>
</table></div>
<p>Para la exponencial, el programa pide el tiempo medio (MTBF) por defecto. Si prefieres ingresar λ, desmarca la opción en <a href="#" data-act="settings">Configuración</a>.</p>
<p>A la derecha hay una <b>vista previa</b> de la pdf, R(t) o λ(t), y el <b>Experimentador</b>: escribe un tiempo y ves R, F, f, λ y la media del bloque al instante. <b>Ajustar a datos de vida…</b> abre el ajuste por máxima verosimilitud y aplica el resultado al bloque (sección 14).</p>
<h3>Pestaña Reparación</h3>
<p>Marca <b>El bloque puede repararse</b> y elige la distribución del tiempo de reparación (Weibull, Exponencial, Normal o Lognormal). Solo la usa la simulación de mantenibilidad. Se marca en el diagrama con una “R”.</p>
<h3>Pestaña Optimización</h3>
<p><b>Confiabilidad máxima alcanzable</b> (por defecto 0,999), <b>factibilidad</b> de mejorarla (Fácil – Moderada – Difícil) y la casilla para incluir el bloque en la optimización. También se marca con clic derecho › Marcar para optimización (cuadro verde en la esquina). El gráfico muestra cómo crece el costo relativo al acercarse al máximo.</p>
<h3>Pestaña Otros</h3>
<p><b>Bloque como diagrama:</b> el bloque pasa a representar otro diagrama del proyecto (subsistema). Su confiabilidad se calcula a partir de ese diagrama y se dibuja con forma de carpeta.</p>
<p><b>Capacidad del bloque:</b> aporte del bloque a la capacidad de los nodos a los que llega (sección 8). Por defecto 1.</p>
<h3>Nodos</h3>
<p>Un nodo (círculo) representa una configuración <b>k de n</b>: el sistema pasa por el nodo si al menos <b>k</b> de las ramas que llegan a él funcionan. En el círculo se lee “k/n”. Por defecto un nodo no falla; si se marca <i>El nodo puede fallar</i>, recibe su propia distribución. El nodo puede ser de redundancia <b>activa</b> (todas las ramas operan) o <b>en espera</b> (sección 8).</p>

<h2>6. Construir el diagrama</h2>
<h3>Reglas</h3>
<ul>
<li>El diagrama debe tener <b>un solo punto de inicio</b> (sin conexiones de entrada) y <b>un solo punto final</b> (sin conexiones de salida).</li>
<li>Si el sistema empieza con ramas en paralelo, agrega un <b>bloque de inicio que no falle</b> y conéctalo a cada rama (Ejemplo 1). Lo mismo al final: un bloque o nodo de fin.</li>
<li>Las conexiones tienen sentido (flecha). <b>No se admiten ciclos</b>. Si una línea opera en ambos sentidos, represéntala con dos bloques, uno por sentido (Ejemplo 5).</li>
<li>Un bloque con varias entradas funciona si <b>al menos una</b> rama de entrada funciona (paralelo). Para exigir más de una, usa un nodo k de n.</li>
<li>Los bloques sin ninguna conexión se ignoran y se avisan en la barra de estado.</li>
</ul>
<h3>Edición</h3>
<div class="tw"><table>
<tr><th>Acción</th><th>Cómo</th></tr>
<tr><td>Seleccionar</td><td>Clic. <kbd>Shift</kbd>+clic agrega a la selección. Arrastrar sobre el fondo selecciona por rectángulo. <kbd>Ctrl</kbd>+<kbd>A</kbd> todo.</td></tr>
<tr><td>Mover</td><td>Arrastrar, o flechas del teclado (<kbd>Shift</kbd> para pasos largos).</td></tr>
<tr><td>Conectar</td><td>Con un bloque seleccionado aparece un punto a su derecha: arrástralo hasta el destino. O modo <b>Unir</b> (<kbd>J</kbd>): arrastra de origen a destino, o clic en origen y clic en destino. Clic derecho o <kbd>Esc</kbd> sale del modo.</td></tr>
<tr><td>Eliminar</td><td>Seleccionar bloque o conexión y <kbd>Supr</kbd>. Al borrar un bloque se borran sus conexiones.</td></tr>
<tr><td>Invertir una conexión</td><td>Clic derecho sobre la flecha › Invertir sentido.</td></tr>
<tr><td>Copiar / pegar / duplicar</td><td><kbd>Ctrl</kbd>+<kbd>C</kbd> / <kbd>Ctrl</kbd>+<kbd>V</kbd> / <kbd>Ctrl</kbd>+<kbd>D</kbd>. Se copian también las conexiones internas.</td></tr>
<tr><td>Activar / desactivar (“qué pasa si”)</td><td>Clic derecho › Desactivar bloque, o <kbd>T</kbd>. Un bloque desactivado (X roja) se considera <b>fallado o ausente</b>.</td></tr>
<tr><td>Deshacer / rehacer</td><td><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> (hasta 60 pasos).</td></tr>
<tr><td>Zoom</td><td><kbd>+</kbd> / <kbd>−</kbd>, <kbd>Ctrl</kbd>+rueda del mouse, <kbd>0</kbd> ajusta a la ventana.</td></tr>
</table></div>

<h2>7. Subdiagramas</h2>
<p>Un bloque puede representar un diagrama completo. Dos usos:</p>
<ol>
<li><b>Desglose de un equipo</b> (Ejemplo 3): la “Placa de circuito” del Diagrama1 se define como el Diagrama2 (procesador en serie con ventilador). En Propiedades › Otros marca <i>Bloque como diagrama</i> y elige el diagrama.</li>
<li><b>Reutilizar un sistema entero</b> (Pregunta 4): arma el sistema, usa Diagrama › Agregar diagrama a la plantilla y arrastra ese bloque carpeta a otro diagrama las veces que necesites. Cada copia se trata como un subsistema independiente.</li>
</ol>
<p>Clic derecho sobre un bloque carpeta › Abrir subdiagrama, para ir a él. El programa impide referencias circulares (un diagrama que se contiene a sí mismo).</p>
<p><button type="button" class="btn small" data-ex="ej3">Cargar Ejemplos 2 y 3</button></p>

<h2>8. Redundancia en espera, fraccionamiento y capacidad</h2>
<p>Pensado para parques de equipos rotatorios (compresores, bombas, generadores), donde no siempre operan todas las unidades y lo que importa es cuánta capacidad queda disponible.</p>
<h3>Redundancia en espera (standby)</h3>
<p>En las propiedades de un nodo, pestaña Nodo, elige <b>Tipo de redundancia › En espera</b>. Entonces operan <b>k</b> unidades y el resto queda de reserva. En el diagrama el nodo se dibuja con anillo punteado y la etiqueta <b>ESP</b>.</p>
<ul>
<li><b>Prioridad de entrada:</b> de arriba hacia abajo según la posición de los bloques en el diagrama. Las k primeras parten operando; para cambiar el orden, mueve los bloques.</li>
<li><b>Factor de envejecimiento en espera:</b> 0 = reserva fría (no acumula desgaste); 1 = caliente (envejece como si operara, equivale a la redundancia activa); un valor intermedio representa una reserva tibia. El tiempo en espera consume vida a esa fracción de la tasa normal.</li>
<li><b>Probabilidad de conmutación exitosa:</b> cuando falla una unidad operando, entra la siguiente reserva disponible con esta probabilidad. Si no arranca, queda fallada (y va a reparación si es reparable) y se intenta con la siguiente.</li>
<li><b>Tiempo de conmutación:</b> lo que tarda la reserva en tomar la carga (arranque, sincronización, puesta en línea). Mientras conmuta no opera ni envejece; si con eso el nodo queda bajo k, el sistema cae durante ese lapso y se cuenta como una caída. 0 = instantáneo.</li>
<li>Cuando una unidad reparada vuelve, pasa a reserva si ya operan k unidades, o entra a operar si faltan.</li>
</ul>
<p>Las ramas de un grupo en espera deben ser bloques simples que pueden fallar y que solo se conectan a ese nodo. Los diagramas con redundancia en espera se calculan con la <b>Simulación</b> (confiabilidad y mantenibilidad); Analizar, la calculadora rápida y los gráficos exactos avisan que no aplican.</p>
<p class="formula">Verificación: 1 de 2 en espera fría, exponencial con λt = 1 → R = e<sup>−λt</sup>(1 + λt) = 0,7358 · simulado 0,7353</p>
<h3>Fraccionamiento (capacidad compartida)</h3>
<p>Un grupo de unidades que se reparten la carga, como 3 equipos de 33 % (fraccionamiento al 100 %) o 3 de 40 % (al 120 %). En el nodo elige <b>Tipo de redundancia › Fraccionamiento</b> e indica la <b>demanda</b>; la capacidad de cada unidad va en sus propiedades › Otros. En el diagrama el nodo muestra “Σn” y la etiqueta <b>FRC</b>.</p>
<p>En el cálculo exacto el nodo aporta la <b>fracción esperada de la demanda atendida</b>:</p>
<p class="formula">E = Σ<sub>estados</sub> P(estado) · mín(capacidad disponible, demanda) / demanda</p>
<p>Cuando solo el estado con todas las unidades supera la demanda, E coincide con la fórmula de clase Σ R<sub>i</sub>L<sub>i</sub> + (1 − ΣL<sub>i</sub>)·ΠR<sub>i</sub>. Con R = 0,75: 3 × 33,3 % da E = 0,75 y 3 × 40 % da E = 0,8156. Al multiplicar E por las confiabilidades de los demás subsistemas, Rs pasa a ser un <b>índice de servicio esperado</b> y deja de ser solo la probabilidad de cumplir. Si necesitas la probabilidad de cubrir la demanda completa, usa un nodo activo k de n (3 de 3 en ambos casos) o mira “Probabilidad de cubrir la demanda completa” en la tabla COPT.</p>
<p>Las unidades deben ser bloques simples que reciben la conexión del mismo bloque y solo se conectan al nodo. En la simulación, el nodo funciona mientras la capacidad disponible cubra la demanda, y el informe agrega la fracción media de demanda atendida.</p>
<h3>Capacidad por estado</h3>
<p>Cada bloque tiene una <b>capacidad</b> (Propiedades › Otros), por ejemplo 50 si cada compresor cubre el 50 % de la demanda o el caudal en MMm³/d. La unidad de capacidad se define en Configuración. Con eso:</p>
<ul>
<li><b>Calculadora rápida › Capacidad de un nodo (COPT):</b> tabla de probabilidad de capacidad de las ramas que llegan a un nodo, con la probabilidad de cada unidad tomada como disponibilidad estacionaria MTTF/(MTTF+MTTR) o como confiabilidad a un tiempo t. Entrega cada nivel de capacidad, su probabilidad, la probabilidad acumulada de tener al menos ese nivel, las horas al año equivalentes, la capacidad media disponible y la probabilidad de cumplir k de n. Si indicas una <b>demanda</b> (o el nodo es de fraccionamiento), agrega la fracción esperada de la demanda atendida, la probabilidad de cubrirla completa y la sensibilidad ∂E/∂R<sub>i</sub> de cada unidad. No aplica a nodos en espera.</li>
<li><b>Simulación de mantenibilidad:</b> para cada nodo con dos o más ramas reporta el porcentaje del tiempo con m de n unidades en servicio, la capacidad media en cada estado, la capacidad media disponible y las horas del período sin cumplir k. Funciona con redundancia activa y en espera; en espera, la reserva no aporta capacidad hasta que entra a operar.</li>
</ul>
<p>La COPT supone unidades independientes y alimentación aguas arriba disponible. La simulación considera además la dependencia temporal de fallas y reparaciones. Con unidades reparables y redundancia activa, ambas deben coincidir (el ejemplo de compresores lo permite comprobar).</p>
<h2>9. Analizar</h2>
<p><b>Herramientas › Analizar</b> (<kbd>F5</kbd>) revisa el diagrama y muestra la <b>función de confiabilidad del sistema</b> como suma de productos disjuntos, por ejemplo para dos discos en paralelo con una placa en serie:</p>
<p class="formula">Rs = R1·R2·R3 + R1·(1−R2)·R3 + (1−R1)·R2·R3</p>
<p>Cada término es una combinación excluyente de estados de los componentes, de modo que la suma es exacta. La leyenda indica qué bloque es cada Rᵢ y su distribución. Los bloques que no fallan y los nodos no aparecen en la expresión.</p>
<p>Las demás herramientas analizan el diagrama automáticamente; no es obligatorio pulsar Analizar antes. El estado cambia a <i>Analizado</i> hasta la siguiente modificación.</p>
<p class="muted small">Método: descomposición pivotal (factorización de Shannon) sobre la función de estructura del diagrama. Los subdiagramas se evalúan por separado y entran como un componente más. Si el diagrama superara 300 000 términos, el programa pide dividirlo en subdiagramas o usar la simulación.</p>

<h2>10. Calculadora rápida (QCP)</h2>
<p><b>Herramientas › Calculadora rápida</b> (<kbd>F6</kbd>). Elige el diagrama arriba. Pestaña <b>General</b>:</p>
<div class="tw"><table>
<tr><th>Cálculo</th><th>Dato</th><th>Resultado</th></tr>
<tr><td>Probabilidad estándar</td><td>Tiempo de misión t</td><td>Rs(t), o F(t) = 1 − Rs(t) si marcas la casilla</td></tr>
<tr><td>Probabilidad condicional</td><td>Tiempo operado T y tiempo adicional t</td><td>R(t|T) = Rs(T+t) / Rs(T)</td></tr>
<tr><td>Tasa de falla</td><td>Tiempo t</td><td>λ(t) = f(t) / Rs(t), con f = −dRs/dt</td></tr>
<tr><td>Tiempo de garantía</td><td>Confiabilidad requerida R</td><td>Tiempo t tal que Rs(t) = R</td></tr>
<tr><td>Información BX %</td><td>Porcentaje X</td><td>Vida BX: tiempo en que ha fallado el X % (Rs = 1 − X/100)</td></tr>
<tr><td>Tiempo medio (MTTF)</td><td>—</td><td>∫₀<sup>∞</sup> Rs(t) dt</td></tr>
<tr><td>Capacidad de un nodo (COPT)</td><td>Nodo, base (disponibilidad o R(t)), demanda opcional</td><td>Tabla de probabilidad de capacidad y fracción esperada de demanda atendida (sección 8)</td></tr>
</table></div>
<p><b>Informe</b> entrega, para cada bloque, su confiabilidad al tiempo de misión, su <b>importancia</b> (∂Rs/∂Rᵢ), el Rs que se obtendría si ese bloque fuera perfecto y el aumento porcentual, con un gráfico de barras; el bloque más importante queda destacado. Como Rs es lineal en cada Rᵢ, la importancia es la pendiente de la curva de sensibilidad: Rs(Rᵢ) = Rs + (Rᵢ − Rᵢ actual) · importancia. Con <i>Copiar (para Excel)</i> o <i>Enviar a hoja de cálculo</i> llevas cualquier resultado a una tabla.</p>

<h2>11. Optimización de la confiabilidad</h2>
<p>Responde: <i>¿qué confiabilidad debe tener cada componente para que el sistema llegue a la meta, al menor costo?</i></p>
<ol class="steps">
<li>En cada bloque que se puede mejorar, define en la pestaña Optimización la confiabilidad máxima y la factibilidad, y márcalo para optimizar (cuadro verde).</li>
<li>QCP › pestaña <b>Optimización</b>: tiempo de misión, meta de confiabilidad y tolerancia › <b>Optimizar</b>.</li>
</ol>
<p>Se minimiza la suma de costos relativos de los bloques sujetos a Rs ≥ meta, con el modelo de costo de Mettas (2000), el mismo de BlockSim:</p>
<p class="formula">cᵢ(Rᵢ) = exp[ (1 − fᵢ) · (Rᵢ − Rᵢ,min) / (Rᵢ,max − Rᵢ) ]</p>
<p>Rᵢ,min es la confiabilidad actual del bloque al tiempo de misión, Rᵢ,max la máxima alcanzable y fᵢ la factibilidad (Fácil = 0,9; Moderada = 0,5; Difícil = 0,1). El resultado lista, por bloque, la confiabilidad actual, la confiabilidad meta y el <b>N.E.P.U.</b> (número de unidades equivalentes en paralelo): cuántas unidades idénticas en paralelo darían esa misma confiabilidad.</p>
<p class="formula">N.E.P.U. = ln(1 − R<sub>meta</sub>) / ln(1 − R<sub>actual</sub>)</p>
<p>Si la meta no se puede alcanzar ni con todos los bloques en su máximo, el programa lo informa con la confiabilidad máxima posible. La <b>tolerancia</b> (Configuración) controla cuánto puede pasarse de la meta: 0,001 por defecto; con 0,0001 el ajuste es más fino (Ejemplo 2 de la guía).</p>

<h2>12. Gráficos</h2>

</ul>

<p>Archivo › Agregar hoja de cálculo. Las celdas se editan como en Excel. El botón <b>f(x) Asistente de funciones</b> escribe resultados a partir de la celda seleccionada:</p>

<h2>14. Ajuste de distribución a datos de vida</h2>
<p>Herramientas › Ajuste de distribución, o el botón <i>Ajustar a datos de vida…</i> en las propiedades del bloque.</p>
<ol class="steps">
<li>Elige el tipo de datos:
<ul><li><b>Tiempos de falla con suspensiones:</b> columnas Cantidad, Estado (F = falla, S = suspensión o unidad que sigue operando) y Tiempo.</li>
<li><b>Datos de inspección:</b> agrega la columna <i>Último inspeccionado</i>. Una falla con último inspeccionado = a y tiempo = b significa que falló entre a y b (si a = 0, antes de b).</li></ul></li>
<li>Escribe las filas o usa <b>Pegar desde Excel</b> (acepta 1 a 4 columnas, separadas por tabulación, punto y coma o espacio).</li>
<li><b>Evaluar distribuciones:</b> ajusta por máxima verosimilitud (MLE) Exponencial 1P y 2P, Weibull 2P y 3P, Normal y Lognormal, y las ordena por AIC (menor es mejor). La gráfica compara la curva ajustada con la estimación de Kaplan–Meier de los datos.</li>
<li>Elige una fila y pulsa <b>Usar en el bloque</b> (o <b>Crear bloque en la plantilla</b>). Los datos quedan guardados en el bloque para volver a ajustarlos.</li>
</ol>
<p class="muted small">La Exponencial 2P toma γ igual a la primera falla, como su estimador MLE. La Weibull 3P se descarta si β &lt; 1 y γ coincide con la primera falla, caso en que la verosimilitud no tiene un máximo finito.</p>
<p><button type="button" class="btn small" data-act="fit">Abrir el ajuste de distribución</button></p>

<h2>15. Simulación</h2>
<p>Herramientas › Simulación (<kbd>F8</kbd>). Tres pestañas:</p>
<ul>
<li><b>Confiabilidad:</b> tiempo final e incremento. Se sortean tiempos de falla de cada bloque y se estima R(t) del sistema; el informe la compara con el valor exacto. Sirve para verificar o para sistemas demasiado grandes para el cálculo exacto.</li>
<li><b>Mantenibilidad:</b> tiempo final e incremento. Cada bloque falla según su distribución de falla y vuelve a operar tras un tiempo de reparación (si es reparable); el sistema se evalúa en cada cambio de estado. Entrega tiempo fuera de servicio, tiempo en servicio, disponibilidad media y puntual, confiabilidad en el período, número esperado de caídas, MTBDE (tiempo medio entre caídas del sistema) y MDT (duración media de cada caída), para el sistema y para cada bloque. Si los bloques tienen logística (sección 16) se agregan el desglose del tiempo fuera de servicio, los repuestos y las cuadrillas.</li>
<li><b>Configuración:</b> lazos externos (repeticiones independientes, muestran la dispersión), lazos internos (simulaciones por repetición) y semilla. Con la misma semilla los resultados se repiten.</li>
</ul>
<p>Si el diagrama tiene nodos, la simulación de mantenibilidad agrega por cada nodo la distribución del tiempo por estado (m de n unidades en servicio) y la capacidad media disponible. Los grupos en espera solo se pueden calcular aquí (sección 8).</p>
<p>El error de muestreo de una probabilidad estimada es del orden de √(R(1−R)/N). Con 10 000 simulaciones y R ≈ 0,95 es ±0,002 aprox.</p>
<p class="muted small">Supuestos: componentes independientes salvo dentro de un grupo en espera, reparación y mantención preventiva “como nuevo”. Sin logística definida, las reparaciones parten de inmediato y no hay límite de repuestos ni de personal. Una Normal de reparación se trunca en 0. Los bloques duplicados para representar una misma línea en dos sentidos se simulan como independientes, igual que en la guía.</p>

<h2>16. Logística de mantenimiento: repuestos, cuadrillas y mantención preventiva</h2>
<p>La disponibilidad real de un parque no depende solo de cuánto dura la reparación, sino de lo que pasa antes: esperar el repuesto, esperar a que haya personal, trasladarse al equipo. Este módulo agrega esos tiempos a la simulación de mantenibilidad para responder preguntas como “¿cuántos kits de válvulas conviene tener en bodega?” o “¿alcanza una cuadrilla para las tres plantas?”.</p>
<h3>Recursos del proyecto</h3>
<p><b>Herramientas › Repuestos y cuadrillas…</b> define los recursos compartidos:</p>
<ul>
<li><b>Repuestos:</b> nombre, stock inicial y reposición. Política uno por uno (S−1, S): cada reparación consume una unidad y genera un pedido que llega tras el plazo de reposición (fijo o exponencial). Si no hay stock, el equipo espera la próxima llegada (cola por orden de llegada). <i>Sin reposición</i> = solo se cuenta con el stock inicial.</li>
<li><b>Cuadrillas:</b> nombre y cantidad de equipos de trabajo que pueden intervenir en paralelo. La cuadrilla se ocupa durante la reparación activa y durante la mantención preventiva. Cola: primero las reparaciones (por orden de llegada) y después las mantenciones preventivas.</li>
</ul>
<h3>Pestaña Logística del bloque</h3>
<p>En las propiedades de un bloque reparable:</p>
<ul>
<li><b>Demora logística:</b> tiempo desde la falla hasta que se puede intervenir (aviso, traslado, permisos, aislamiento, enfriamiento). Valor fijo o distribución.</li>
<li><b>Repuesto</b> que consume cada reparación y <b>cuadrilla</b> que la ejecuta. “Ninguno” significa recurso ilimitado.</li>
<li><b>Mantención preventiva por calendario:</b> intervalo, fecha de la primera (vacía = igual al intervalo) y duración (fija o distribución). Detiene el equipo y lo deja como nuevo. Si en la fecha el equipo está fallado, esa mantención se omite; si la cuadrilla está ocupada, el equipo sigue operando hasta que se libere. En equipos con β &gt; 1 reduce las fallas; con β ≤ 1 solo agrega tiempo detenido.</li>
</ul>
<p>Secuencia ante una falla: <b>demora logística → espera de repuesto → espera de cuadrilla → reparación activa</b>. El cuadro azul de la pestaña muestra el tiempo mínimo fuera de servicio por falla sin esperas.</p>
<h3>Resultados</h3>
<ul>
<li><b>Desglose por bloque:</b> horas fuera de servicio separadas en demora logística, espera de repuesto, espera de cuadrilla, reparación activa y mantención preventiva, y el porcentaje atribuible a esperas logísticas. Es la tabla que indica dónde invertir.</li>
<li><b>Mantención preventiva:</b> mantenciones realizadas y omitidas por bloque.</li>
<li><b>Repuestos:</b> demandas, demandas sin stock, tasa de llenado (fracción atendida desde bodega), stock medio y equipos esperando.</li>
<li><b>Cuadrillas:</b> utilización, cuadrillas ocupadas en promedio y trabajos en cola.</li>
</ul>
<p>El ejemplo <button type="button" class="btn small" data-ex="logistica">Compresores con logística</button> compara el mismo parque 2 de 3 sin logística, con 1 kit en stock y con 2 kits. Con datos ilustrativos, el segundo kit sube la disponibilidad de ≈0,978 a ≈0,996: casi toda la indisponibilidad del caso con 1 kit era espera de repuesto.</p>
<p class="muted small">Supuestos: un tipo de repuesto por bloque y una unidad por reparación; cuadrillas idénticas; mantención solo por calendario (no por horas de operación ni por condición); sin costos. Las reparaciones no se interrumpen.</p>

<h2>19. Verificar el programa</h2>
<p><b>Ayuda › Verificar el programa</b> ejecuta un autodiagnóstico del motor de cálculo dentro de tu propio navegador y entrega un informe imprimible. Tarda uno o dos segundos.</p>
<p>Cada comprobación enfrenta al motor contra un valor que se conoce por otra vía:</p>
<div class="tw"><table>
<tr><th>Área</th><th>Contra qué se compara</th></tr>
<tr><td>Configuraciones básicas</td><td>Fórmulas cerradas de serie (ΠRᵢ), paralelo (1−Π(1−Rᵢ)), k-de-n (binomial) y un puente de 5 componentes resuelto por enumeración de sus 32 estados</td></tr>
<tr><td>Distribuciones</td><td>Valores de tabla: R(η)=e⁻¹ en Weibull para todo β, media = η·Γ(1+1/β), R(μ)=0,5 y R(μ+σ)=0,158655 en la normal, ausencia de memoria en la exponencial, y f(t) contra la derivada numérica de R(t)</td></tr>
<tr><td>Métricas del sistema</td><td>MTTF = 1/Σλ en serie exponencial y 1,5/λ en paralelo de 2; λ(t)=Σλᵢ; R(t|T)=R(T+t)/R(T); vida B10 contra su fórmula cerrada</td></tr>

<h2>22. Diferencias con BlockSim 1.0 y límites</h2>
<ul>
<li>BlockSim 1.0 no tenía redundancia en espera, fraccionamiento, tablas de capacidad ni gráficos de sensibilidad; son agregados de SimBloques.</li>
<li>Las distribuciones de los bloques se ingresan en el programa o se ajustan con el módulo integrado; no se enlaza a Weibull++.</li>
<li>Los íconos de los bloques son un conjunto propio (generador, bomba, compresor, motor, válvula, transformador, etc.), no archivos .bmp.</li>
<li>La hoja de cálculo guarda valores, no fórmulas vivas: si cambias el diagrama, vuelve a ejecutar el asistente.</li>
<li>El cálculo exacto supone componentes independientes. Las repeticiones de un mismo componente en el diagrama se tratan como componentes distintos.</li>
<li>La optimización usa un algoritmo de asignación marginal (mayor ganancia de confiabilidad por unidad de costo) con ajuste fino a la meta. Puede diferir en el cuarto decimal del algoritmo de BlockSim cuando hay bloques con costo casi igual.</li>
<li>El módulo logístico (repuestos, cuadrillas, demoras, mantención preventiva y tiempo de conmutación) no existe en BlockSim 1.0. Límites: un tipo de repuesto por bloque, cuadrillas idénticas sin prioridad entre equipos, mantención preventiva solo por calendario y sin costos.</li>
<li>La capacidad se suma en cada nodo a partir de las ramas que llegan a él; no es un cálculo de flujo máximo de red. Las unidades de reserva en espera no aportan capacidad mientras esperan.</li>
</ul>

function exportBox(title, filename, text, mime) {
  var ta = h('textarea', { class: 'export-text', id: 'export-text', readonly: true, spellcheck: 'false' });
  ta.value = text;
  openModal({
    title: title, wide: true,
    body: h('div', { class: 'stack' },
      h('p', { class: 'muted' }, 'Descarga el archivo o copia el contenido. En la vista web de Claude la descarga puede estar bloqueada; en ese caso usa Copiar y pégalo en un archivo de texto. Abriendo el programa como archivo .html local, la descarga funciona normalmente.'),
      ta),
    buttons: [
      { label: 'Copiar', onClick: function () { copyText(text, ta); return false; } },
      { label: 'Descargar ' + filename, primary: true, onClick: function () { downloadText(filename, text, mime); return false; } },
      { label: 'Cerrar' }
    ]
  });
}
function copyText(text, ta) {
  try {
    navigator.clipboard.writeText(text).then(function () { toast('Copiado al portapapeles.'); }, function () { fallbackCopy(text, ta); });
  } catch (e) { fallbackCopy(text, ta); }
}
function fallbackCopy(text, ta) {
  var t = ta || h('textarea', { style: 'position:fixed;left:-9999px' });
  if (!ta) { t.value = text; document.body.appendChild(t); }
  t.select();
  var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  if (!ta) document.body.removeChild(t);
  toast(ok ? 'Copiado al portapapeles.' : 'Selecciona el texto y cópialo con Ctrl+C.');
}
function downloadText(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var a = h('a', { href: URL.createObjectURL(blob), download: filename });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('Descarga iniciada: ' + filename);
  } catch (e) { toast('La descarga no está disponible aquí. Usa Copiar.', 'warn'); }
}
function pickFile(accept, cb) {
  var inp = h('input', { type: 'file', accept: accept, style: 'display:none' });
  inp.addEventListener('change', function () {
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { cb(String(r.result), f.name); };
    r.readAsText(f);
  });
  document.body.appendChild(inp); inp.click(); setTimeout(function () { document.body.removeChild(inp); }, 60000);
}

/* ---------- Teclado ---------- */
function onKey(e) {
  if (modalStack.length) { if (e.key === 'Escape') modalStack[modalStack.length - 1].close(); return; }
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  var ctrl = e.ctrlKey || e.metaKey, k = e.key;
  if (k === 'F1') { e.preventDefault(); openManual(); return; }
  if (k === 'F5') { e.preventDefault(); cmdAnalyze(); return; }
  if (k === 'F6') { e.preventDefault(); openQCP(); return; }
  if (k === 'F7') { e.preventDefault(); cmdPlot(); return; }
  if (k === 'F8') { e.preventDefault(); openSim(); return; }
  if (ctrl && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (ctrl && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (ctrl && (k === 's' || k === 'S')) { e.preventDefault(); cmdSaveProject(); return; }
  if (ctrl && (k === 'o' || k === 'O')) { e.preventDefault(); cmdOpenProject(); return; }
  if (ctrl && (k === 'p' || k === 'P')) { e.preventDefault(); cmdProjectReport(); return; }
  var d = activeDiagram(); if (!d) return;
  if (ctrl && (k === 'a' || k === 'A')) { e.preventDefault(); cmdSelectAll(); return; }
  if (ctrl && (k === 'c' || k === 'C')) { e.preventDefault(); cmdCopy(); return; }
  if (ctrl && (k === 'v' || k === 'V')) { e.preventDefault(); cmdPaste(); return; }
  if (ctrl && (k === 'd' || k === 'D')) { e.preventDefault(); cmdDuplicate(); return; }
  if (ctrl) return;
  if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); cmdDelete(); return; }
  if (k === 'Escape') { if (App.connect) toggleConnect(); App.sel.clear(); App.selLink = -1; renderDiagram(); return; }
  if (k === 'Enter') { e.preventDefault(); cmdProps(); return; }
  if (k === 'b' || k === 'B') { cmdAddElement('block'); return; }
  if (k === 'n' || k === 'N') { cmdAddElement('node'); return; }
  if (k === 'j' || k === 'J') { toggleConnect(); return; }
  if (k === 't' || k === 'T') { cmdToggleActive(); return; }
  if (k === 'o' || k === 'O') { cmdToggleOpt(); return; }
  if (k === '0') { zoomFit(); return; }
  if (k === '+' || k === '=') { setZoom(d, (App.zoom[d.id] || 1) * 1.15); return; }
  if (k === '-') { setZoom(d, (App.zoom[d.id] || 1) / 1.15); return; }
  if (k.indexOf('Arrow') === 0 && App.sel.size) {
    e.preventDefault(); commit();
    var step = e.shiftKey ? 20 : 5, dx = k === 'ArrowLeft' ? -step : k === 'ArrowRight' ? step : 0, dy = k === 'ArrowUp' ? -step : k === 'ArrowDown' ? step : 0;
    d.elements.forEach(function (el) { if (App.sel.has(el.id)) { el.x = Math.max(0, el.x + dx); el.y = Math.max(0, el.y + dy); } });
    renderDiagram(); save();
  }
}

/* ===================== Editor de diagramas (RBD) ===================== */
var BW = 64, BH = 52, ND = 40;
function elSize(e) { return e.kind === 'node' ? { w: ND, h: ND } : { w: BW, h: BH }; }
function elCenter(e) { var s = elSize(e); return { x: e.x + s.w / 2, y: e.y + s.h / 2 }; }
function edgePoint(e, tx, ty) {
  var c = elCenter(e), dx = tx - c.x, dy = ty - c.y, L = Math.hypot(dx, dy) || 1;
  if (e.kind === 'node') return { x: c.x + dx / L * (ND / 2 + 1), y: c.y + dy / L * (ND / 2 + 1) };
  var hw = BW / 2 + 1, hh = BH / 2 + 1;
  var s = Math.min(Math.abs(dx) > 1e-9 ? hw / Math.abs(dx) : Infinity, Math.abs(dy) > 1e-9 ? hh / Math.abs(dy) : Infinity);
  return { x: c.x + dx * s, y: c.y + dy * s };
}
function splitLabel(s) {
  s = String(s || '');
  if (s.length <= 15) return [s];
  var words = s.split(' '), lines = [''], i;
  for (i = 0; i < words.length; i++) {
    var cur = lines[lines.length - 1];
    if ((cur + ' ' + words[i]).trim().length > 15 && cur) { if (lines.length === 2) { lines[1] += ' ' + words.slice(i).join(' '); break; } lines.push(words[i]); }
    else lines[lines.length - 1] = (cur + ' ' + words[i]).trim();
  }
  return lines.map(function (l) { return l.length > 18 ? l.slice(0, 17) + '…' : l; });
}

function renderDiagramDoc(view, D) {

/* ---------- Panel de resultados ---------- */

    title: title, wide: true, xwide: !!opts.xwide, body: body,

/* ===================== Herramientas: análisis, QCP, gráficos, hojas, simulación ===================== */
function getSystem(D, quiet) {
  if (!D) { if (!quiet) toast('Abre o crea un diagrama primero.', 'warn'); return null; }
  try { return new BS.System(App.P, D.id); }
  catch (e) { if (!quiet) toast(e.message, 'warn'); return null; }
}
function diagSelect(id, selected, onChange) {
  var s = h('select', { id: id });
  App.P.diagrams.forEach(function (d) { s.appendChild(h('option', { value: d.id, selected: selected && d.id === selected.id }, d.name)); });
  if (onChange) s.addEventListener('change', onChange);
  return s;
}
function today() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + '-' + p(d.getMonth() + 1) + '-' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- Analizar ---------- */
function cmdAnalyze() {
  var D = toolDiagram(); var S = getSystem(D); if (!S) return;
  App.status[D.id] = 'ok';
  var c = S.c, expr = S.expression(), legend = [];
  S.comps.forEach(function (cp) { legend.push([cp.label, cp.name, cp.desc]); });
  c.topo.forEach(function (k) {
    var e = c.els[k]; if (c.varIdx[k] != null) return;
    var why = e.active === false ? 'Desactivado (se considera fallado)' : S.memberOf[e.id] ? 'Unidad del fraccionamiento "' + S.memberOf[e.id] + '": ' + (e.isStatic ? 'estático, R=' + BS.fmtNum(e.staticR, 6) : e.canFail ? BS.distLabel(e.failure, useMean()) : 'no falla') + ' · capacidad ' + fmt(BS.capOf(e), 3)
      : e.kind === 'node' ? 'Nodo: ' + (e.k || 1) + ' de ' + c.preds[k].length + ' (no falla)' : 'No puede fallar (R = 1)';
    legend.push(['—', e.name, why]);
  });
  var shown = expr.length > 80 ? expr.slice(0, 80) : expr;
  var secs = [
    { kv: [['Fecha', today()], ['Proyecto', App.P.name], ['Diagrama', D.name], ['Bloques en el diagrama', String(D.elements.length)], ['Componentes que pueden fallar', String(S.comps.length)], ['Caminos inicio → fin', String(c.nPaths)], ['Términos de la expresión', String(expr.length)]] },
    { heading: 'Confiabilidad del sistema, Rs =', lines: shown },
    expr.length > 80 ? { text: 'Se muestran 80 de ' + expr.length + ' términos. La expresión completa se usa en todos los cálculos.' } : null,
    { text: 'Rᵢ es la confiabilidad del componente i en el tiempo t; (1−Rᵢ) su probabilidad de falla. Los términos son mutuamente excluyentes, por lo que se suman directamente.' + (S.comps.some(function (cp) { return cp.frac; }) ? ' Eᵢ es la fracción esperada de la demanda atendida por un grupo de fraccionamiento; con ella, Rs pasa a ser un índice de servicio esperado y no solo una probabilidad.' : '') },
    { heading: 'Leyenda', table: { head: ['Etiqueta', 'Bloque', 'Definición'], rows: legend } }
  ].filter(Boolean);
  if (c.ignored.length && D.elements.length > 1) secs.push({ text: 'Bloques sin conectar (no se incluyen): ' + c.ignored.join(', ') + '.', cls: 'warn-text' });
  showResults('Resultados del análisis – ' + D.name, secs);
  renderDiagram(); renderExplorer();
}

  if (r.demand) res('Fracción esperada de la demanda atendida', fmt(r.served, 6), 'Capacidad media disponible: ' + fmt(r.meanCap, 3) + ' ' + cu + '. El detalle se abre en una ventana aparte.');

    { chart: renderChart({ bars: r.levels.map(function (l) { return { label: fmt(l.cap, 2) + ' ' + cu, value: l.p }; }), yLabel: 'Probabilidad', width: 640, height: 260, compact: true, ymin: 0 }) },

/* ---------- Instantánea SVG de un diagrama (recortada, sin grilla ni selección) ---------- */
function diagramSVG(D, opt) {
  opt = opt || {};
  if (!D || !D.elements.length) return '<p class="muted small">El diagrama no tiene bloques.</p>';
  var pad = 22, minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  D.elements.forEach(function (e) {
    var s = elSize(e);
    minX = Math.min(minX, e.x); minY = Math.min(minY, e.y);
    maxX = Math.max(maxX, e.x + s.w); maxY = Math.max(maxY, e.y + s.h + 16 + 14 * splitLabel(e.name).length);
  });
  var W = maxX - minX + pad * 2, H = maxY - minY + pad * 2, ox = pad - minX, oy = pad - minY;
  var byId = {}, inCount = {};
  D.elements.forEach(function (e) { byId[e.id] = e; inCount[e.id] = 0; });
  D.links.forEach(function (l) { if (inCount[l.to] != null) inCount[l.to]++; });

  var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + Math.round(W) + ' ' + Math.round(H) + '" role="img" aria-label="Diagrama ' + esc(D.name) + '">';
  s += '<defs><marker id="rarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>';
  s += '<g transform="translate(' + ox + ',' + oy + ')">';
  D.links.forEach(function (l) {
    var a = byId[l.from], b = byId[l.to]; if (!a || !b) return;
    var ca = elCenter(a), cb = elCenter(b), p1 = edgePoint(a, cb.x, cb.y), p2 = edgePoint(b, ca.x, ca.y);
    s += '<path class="link" d="M' + p1.x + ' ' + p1.y + 'L' + p2.x + ' ' + p2.y + '" marker-end="url(#rarr)"/>';
  });
  D.elements.forEach(function (e) {
    var cls = 'el ' + (e.kind === 'node' ? 'node' : 'blk');
    if (e.active === false) cls += ' off';
    var isSub = e.kind !== 'node' && e.asDiagram && e.subId;
    if (!isSub && !e.canFail) cls += ' nofail';
    if (isSub) cls += ' sub';
    s += '<g class="' + cls + '" transform="translate(' + e.x + ',' + e.y + ')">';
    if (e.kind === 'node') {
      s += '<circle class="box" cx="20" cy="20" r="19"/>';
      if (e.redund === 'standby') s += '<circle class="sb-ring" cx="20" cy="20" r="15"/>';
      s += '<text class="node-k" x="20" y="24">' + (e.redund === 'fraction' ? 'Σ' + inCount[e.id] : (e.k || 1) + '/' + inCount[e.id]) + '</text>';
      if (e.redund === 'fraction') s += '<g class="badge-fr"><rect x="26" y="-6" width="20" height="12" rx="3"/><text x="36" y="3">FRC</text></g>';
      if (e.redund === 'standby') s += '<g class="badge-sb"><rect x="26" y="-6" width="20" height="12" rx="3"/><text x="36" y="3">ESP</text></g>';
      if (e.canFail) s += '<circle class="badge-fail" cx="34" cy="6" r="4"/>';
      if (e.optimize) s += '<rect class="badge-opt" x="30" y="30" width="10" height="10"/>';
    } else {
      if (isSub) s += '<path class="box" d="M0 6h22l5-6h-27zM0 6h64v46h-64z"/><path class="box" d="M0 52V0h22l5 6h37v46z"/>';
      else s += '<rect class="box" width="' + BW + '" height="' + BH + '" rx="5"/>';
      s += '<svg x="18" y="' + (isSub ? 13 : 11) + '" width="28" height="28" viewBox="0 0 32 32" class="ic">' + (ICONS[e.icon] || ICONS.generic) + '</svg>';
      if (e.optimize) s += '<rect class="badge-opt" x="57" y="45" width="11" height="11"/>';
      if (e.canRepair && !isSub && e.canFail) s += '<g class="badge-rep"><circle cx="58" cy="7" r="6"/><text x="58" y="10">R</text></g>';
      if (e.isStatic && e.canFail && !isSub) s += '<g class="badge-st"><circle cx="7" cy="7" r="6"/><text x="7" y="10">E</text></g>';
    }
    if (e.active === false) { var sz = elSize(e); s += '<path class="xmark" d="M3 3L' + (sz.w - 3) + ' ' + (sz.h - 3) + 'M' + (sz.w - 3) + ' 3L3 ' + (sz.h - 3) + '"/>'; }
    var sz2 = elSize(e);
    splitLabel(e.name).forEach(function (ln, k) { s += '<text class="lbl" x="' + sz2.w / 2 + '" y="' + (sz2.h + 15 + k * 14) + '">' + esc(ln) + '</text>'; });
    s += '</g>';
  });
  s += '</g></svg>';
  var fig = '<figure class="fig" style="max-width:' + Math.min(100, Math.round(W / 1.9)) + '%">' + s;
  if (opt.caption) fig += '<figcaption>' + esc(opt.caption) + '</figcaption>';
  return fig + '</figure>';
}

/* ---------- Ventana de impresión ---------- */
function printDoc(title, subtitle, bodyHTML) {
  var head = '<header class="doc-head"><div class="brand">SimBloques</div><div class="meta">' +
    esc(App.P.name) + '<br>' + esc(today()) + '</div></header>';
  var foot = '<footer class="doc-foot"><span>' + esc(App.P.name) + ' · SimBloques</span><span>' + esc(today()) + '</span></footer>';
  var bar = '<div class="bar noprint"><span class="hint">Usa «Imprimir» y elige <b>Guardar como PDF</b> para obtener el archivo.</span>' +
    '<button type="button" onclick="window.close()">Cerrar</button>' +
    '<button type="button" class="primary" onclick="window.print()">Imprimir / PDF</button></div>';
  var doc = '<!doctype html><html lang="es"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>' + esc(title) + '</title><style>' + PRINT_CSS + '</style></head><body>' +
    bar + '<div class="sheet">' + head + '<h1>' + esc(title) + '</h1>' +
    (subtitle ? '<p class="sub">' + esc(subtitle) + '</p>' : '') +
    bodyHTML + foot + '</div></body></html>';

  var w = null;
  try { w = window.open('', '_blank'); } catch (e) { w = null; }
  if (!w) {
    exportBox('Informe (HTML)', slug(title) + '.html',
      doc.replace('<div class="bar noprint">', '<div class="bar noprint" hidden>'), 'text/html');
    toast('El navegador bloqueó la ventana emergente. Descarga el HTML y ábrelo para imprimirlo.', 'warn');
    return;
  }
  w.document.open(); w.document.write(doc); w.document.close();
  try { w.focus(); } catch (e) { /* sin foco: el usuario cambia de pestaña */ }
}
function slug(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'informe';
}

/* ---------- Un panel de resultados -> HTML imprimible ---------- */
function resultsToHTML(bodyEl) {
  var c = bodyEl.cloneNode(true);
  // Los contenedores con scroll deben desplegarse completos en papel
  c.querySelectorAll('.tbl-wrap, .expr').forEach(function (n) {
    n.style.maxHeight = 'none'; n.style.overflow = 'visible';
  });
  c.querySelectorAll('.chart').forEach(function (n) { n.removeAttribute('style'); });
  return c.innerHTML;
}

/* ---------- Informe completo del proyecto ---------- */
function diagramReportHTML(D, t, opt) {
  var out = '<h2>' + esc(D.name) + '</h2>';
  if (opt.img) out += diagramSVG(D, { caption: 'Diagrama de bloques · ' + D.name });

  var S = getSystem(D, true);
  if (!S) {
    return out + '<p class="warn-text">El diagrama no se pudo analizar: revisa que exista un camino completo de inicio a fin.</p>';
  }
  var Rs = S.R(t), det = S.detail(t), mt = S.mttf();
  var maxI = det.length ? Math.max.apply(null, det.map(function (d) { return d.imp; })) : 0;

  out += '<div class="kv-list">' +
    kvRow('Tiempo de misión', fmt(t, 4) + ' ' + units()) +
    kvRow('Confiabilidad del sistema Rs(t)', fmtR(Rs)) +
    kvRow('Probabilidad de falla F(t)', fmtR(1 - Rs)) +
    kvRow('Tasa de falla λ(t)', fmt(S.h(t), 6) + ' fallas/' + units()) +
    kvRow('Tiempo medio a la falla (MTTF)', mt === Infinity ? '∞' : fmt(mt, 3) + ' ' + units()) +
    kvRow('Bloques en el diagrama', String(D.elements.length)) +
    kvRow('Componentes que pueden fallar', String(S.comps.length)) +
    kvRow('Caminos inicio → fin', String(S.c.nPaths)) +
    '</div>';

  if (opt.blocks) {
    out += '<h3>Bloques y distribuciones</h3>';
    var rows = D.elements.filter(function (e) { return e.kind !== 'node'; }).map(function (e) {
      var tipo = (e.asDiagram && e.subId) ? 'Subdiagrama' : e.isStatic ? 'Estático' : e.canFail ? 'Distribución' : 'No falla';
      var par = (e.asDiagram && e.subId) ? (function () { var sd = findDiag(e.subId); return sd ? sd.name : '(diagrama no encontrado)'; })()
        : e.isStatic ? 'R = ' + fmt(e.staticR, 6)
          : e.canFail ? BS.distLabel(e.failure, useMean()) : 'R = 1';
      return '<tr' + (e.active === false ? ' class="dim"' : '') + '><td>' + esc(e.name) + '</td><td>' + esc(tipo) + '</td><td>' + esc(par) +
        '</td><td>' + fmt(BS.capOf(e), 3) + '</td><td>' + (e.canRepair ? 'Sí' : 'No') + '</td><td>' + (e.active === false ? 'Desactivado' : 'Activo') + '</td></tr>';
    }).join('');
    out += table(['Bloque', 'Tipo', 'Parámetros', 'Capacidad', 'Reparable', 'Estado'], rows);

    var nodes = D.elements.filter(function (e) { return e.kind === 'node'; });
    if (nodes.length) {
      var inC = {}; D.elements.forEach(function (e) { inC[e.id] = 0; });
      D.links.forEach(function (l) { if (inC[l.to] != null) inC[l.to]++; });
      out += '<h3>Nodos</h3>' + table(['Nodo', 'Redundancia', 'k de n', 'Demanda', 'Puede fallar'],
        nodes.map(function (e) {
          var r = e.redund === 'fraction' ? 'Fraccionamiento' : e.redund === 'standby' ? 'En espera (standby)' : 'Activa';
          var dem = e.redund === 'fraction' ? (e.demand > 0 ? fmt(e.demand, 3) + ' ' + capUnit() : 'suma de capacidades') : '—';
          return '<tr><td>' + esc(e.name) + '</td><td>' + r + '</td><td>' + (e.redund === 'fraction' ? '—' : (e.k || 1) + ' de ' + inC[e.id]) +
            '</td><td>' + esc(dem) + '</td><td>' + (e.canFail ? 'Sí' : 'No') + '</td></tr>';
        }).join(''));
    }
  }

  if (opt.imp && det.length) {
    out += '<h3>Importancia de los componentes</h3>';
    out += table(['Etiqueta', 'Bloque', 'R(t)', 'Importancia ∂Rs/∂Ri', 'Rs si Ri = 1', 'Aumento de Rs'],
      det.map(function (d) {
        var up = Rs + (1 - d.R) * d.imp;
        return '<tr' + (d.imp >= maxI - 1e-12 ? ' class="hl"' : '') + '><td>' + esc(d.label) + '</td><td>' + esc(d.name + (d.group ? ' (' + d.group + ')' : '')) +
          '</td><td>' + fmtR(d.R) + '</td><td>' + fmt(d.imp, 6) + '</td><td>' + fmtR(up) +
          '</td><td>' + (Rs > 0 ? '+' + fmt((up / Rs - 1) * 100, 2) + ' %' : '—') + '</td></tr>';
      }).join(''));
    if (det.length <= 24) {
      var ch = renderChart({ bars: det.map(function (d) { return { label: d.name, value: d.imp }; }), yLabel: 'Importancia ∂Rs/∂Ri', width: 660, height: 250, compact: true, ymin: 0 });
      out += '<div class="res-chart">' + ch.outerHTML + '</div>';
    }
    out += '<p class="muted small">Importancia de Birnbaum ∂Rs/∂Ri: cuánto sube la confiabilidad del sistema por cada unidad que sube la del bloque. ' +
      'El bloque destacado es el que más conviene mejorar.</p>';
  }

  if (opt.curve) {
    var n = 60, pts = [], tm = t > 0 ? t * 1.6 : 1;
    for (var i = 0; i <= n; i++) { var x = tm * i / n; pts.push([x, S.R(x)]); }
    var cc = renderChart({ series: [{ name: 'Rs(t)', pts: pts }], xLabel: 'Tiempo (' + units() + ')', yLabel: 'Confiabilidad', width: 660, height: 280, hover: false, ymin: 0, ymax: 1 });
    out += '<h3>Curva de confiabilidad</h3><div class="res-chart">' + cc.outerHTML + '</div>';
  }

  if (opt.expr) {
    var ex = S.expression(), shown = ex.length > 60 ? ex.slice(0, 60) : ex;
    out += '<h3>Expresión de confiabilidad</h3><div class="expr">Rs = ' + esc(shown.join('\n   + ')) + '</div>';
    if (ex.length > 60) out += '<p class="muted small">Se muestran 60 de ' + ex.length + ' términos. La expresión completa se usa en todos los cálculos.</p>';
    out += '<p class="muted small">Leyenda: ' + S.comps.map(function (cp) { return esc(cp.label + ' = ' + cp.name); }).join(' · ') + '.</p>';
  }
  return out;
}
function kvRow(k, v) { return '<div class="kv"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'; }
function table(head, rowsHTML) {
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>' +
    head.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rowsHTML + '</tbody></table></div>';
}

/* ---------- Imprimir solo el diagrama activo ---------- */
function cmdPrintDiagram() {
  var D = toolDiagram(); if (!D) return;
  if (!D.elements.length) return toast('El diagrama no tiene bloques.', 'warn');
  var body = diagramSVG(D, { caption: D.name + ' · ' + App.P.name });
  var inC = {}; D.elements.forEach(function (e) { inC[e.id] = 0; });
  D.links.forEach(function (l) { if (inC[l.to] != null) inC[l.to]++; });
  body += '<h2>Bloques</h2>' + table(['Bloque', 'Tipo', 'Parámetros', 'Capacidad'],
    D.elements.map(function (e) {
      var tipo, par;
      if (e.kind === 'node') {
        tipo = e.redund === 'fraction' ? 'Nodo · fraccionamiento' : e.redund === 'standby' ? 'Nodo · en espera' : 'Nodo · activa';
        par = e.redund === 'fraction'
          ? 'Demanda ' + (e.demand > 0 ? fmt(e.demand, 3) + ' ' + capUnit() : '= suma de capacidades')
          : (e.k || 1) + ' de ' + inC[e.id];
      } else if (e.asDiagram && e.subId) {
        var sd = findDiag(e.subId); tipo = 'Subdiagrama'; par = sd ? sd.name : '(no encontrado)';
      } else if (e.isStatic) { tipo = 'Estático'; par = 'R = ' + fmt(e.staticR, 6); }
      else if (e.canFail) { tipo = 'Bloque'; par = BS.distLabel(e.failure, useMean()); }
      else { tipo = 'Bloque'; par = 'No falla (R = 1)'; }
      return '<tr' + (e.active === false ? ' class="dim"' : '') + '><td>' + esc(e.name) + '</td><td>' + esc(tipo) +
        '</td><td>' + esc(par) + '</td><td>' + (e.kind === 'node' ? '—' : fmt(BS.capOf(e), 3)) + '</td></tr>';
    }).join(''));
  printDoc('Diagrama: ' + D.name, App.P.name, body);
}
