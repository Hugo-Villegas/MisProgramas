function buildProjectReport(diags, t, opt, notes) {
  var body = '';
  if (notes) body += '<p>' + esc(notes).replace(/\n/g, '<br>') + '</p>';

  // Resumen comparativo
  var rows = diags.map(function (d) {
    var S = getSystem(d, true);
    if (!S) return '<tr class="dim"><td>' + esc(d.name) + '</td><td colspan="5">No analizable</td></tr>';
    var Rs = S.R(t), m = S.mttf();
    return '<tr><td>' + esc(d.name) + '</td><td>' + fmtR(Rs) + '</td><td>' + fmtR(1 - Rs) + '</td><td>' +
      (m === Infinity ? '∞' : fmt(m, 2)) + '</td><td>' + String(d.elements.length) + '</td><td>' + String(S.comps.length) + '</td></tr>';
  }).join('');
  body += '<h2>Resumen</h2>' + table(['Diagrama', 'Rs(' + fmt(t, 2) + ')', 'F(t)', 'MTTF (' + units() + ')', 'Bloques', 'Componentes'], rows);
  body += '<p class="muted small">Todos los resultados están evaluados en t = ' + esc(fmt(t, 4) + ' ' + units()) + '.</p>';

  diags.forEach(function (d, i) {
    body += '<section class="' + (i === 0 ? '' : 'page-break') + '">' + diagramReportHTML(d, t, opt) + '</section>';
  });

  var lgRows = [], trs = function (rows) { return rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join(''); };
  diags.forEach(function (d) {
    d.elements.forEach(function (e) {
      var L = e.logi; if (e.kind === 'node' || !e.canRepair || !L) return;
      var pn = (App.P.pools || []).filter(function (x) { return x.id === L.pool; })[0], cn = (App.P.crews || []).filter(function (x) { return x.id === L.crew; })[0];
      var pm = L.pm && L.pm.on ? 'Cada ' + fmt(L.pm.interval, 2) + ' · ' + BS.specLabel(L.pm.dur) : '—';
      if (!pn && !cn && !(L.delayOn && L.delay) && pm === '—') return;
      lgRows.push([esc(d.name), esc(e.name), L.delayOn ? esc(BS.specLabel(L.delay)) : '—', pn ? esc(pn.name) : '—', cn ? esc(cn.name) : '—', esc(pm)]);
    });
  });
  if (lgRows.length || (App.P.pools || []).length || (App.P.crews || []).length) {
    body += '<section class="page-break"><h2>Logística de mantenimiento</h2>';
    if ((App.P.pools || []).length) body += '<h3>Repuestos</h3>' + table(['Repuesto', 'Stock inicial', 'Reposición'], trs(App.P.pools.map(function (p) { return [esc(p.name), String(p.stock), p.noRestock ? 'Sin reposición' : esc(BS.specLabel(p.lead))]; })));
    if ((App.P.crews || []).length) body += '<h3>Cuadrillas</h3>' + table(['Cuadrilla', 'Cantidad'], trs(App.P.crews.map(function (c) { return [esc(c.name), String(c.count)]; })));
    if (lgRows.length) body += '<h3>Asignación por bloque</h3>' + table(['Diagrama', 'Bloque', 'Demora logística', 'Repuesto', 'Cuadrilla', 'Mantención preventiva'], trs(lgRows));
    body += '<p class="muted small">Se aplica en la simulación de mantenibilidad. Los cálculos exactos de confiabilidad no dependen de la logística.</p></section>';
  }

  var st = App.P.settings;
  body += '<section class="page-break"><h2>Configuración del proyecto</h2><div class="kv-list">' +
    kvRow('Unidad de tiempo', st.units) + kvRow('Unidad de capacidad', st.capUnit) +
    kvRow('Decimales', String(st.dec)) + kvRow('Tolerancia de optimización', fmt(st.tol, 6)) +
    kvRow('Exponencial expresada como', st.useMeanTime ? 'MTBF' : 'λ') +
    '</div><p class="muted small">Generado con SimBloques · Diagramas de bloques de confiabilidad.</p></section>';

  printDoc('Informe de confiabilidad', App.P.name + ' · t = ' + fmt(t, 4) + ' ' + units(), body);
}

/* ===================== Autodiagnóstico del motor =====================
   Comprueba el motor de cálculo contra resultados analíticos conocidos,
   dentro del propio navegador. Ayuda › Verificar el programa.
   ===================================================================== */

function runSelfTest(quick) {
  var groups = [], cur = null, pass = 0, fail = 0, rows = [];

  function g(name) { cur = { name: name, pass: 0, fail: 0 }; groups.push(cur); }
  function chk(name, got, want, tol, ref) {
    tol = tol == null ? 1e-9 : tol;
    var good = (want === Infinity) ? got === Infinity
      : (isFinite(got) && isFinite(want) && Math.abs(got - want) <= tol);
    good ? (pass++, cur.pass++) : (fail++, cur.fail++);
    rows.push({ g: cur.name, name: name, got: got, want: want, ok: good, ref: ref || '' });
    return good;
  }
  function chkT(name, cond, ref) {
    cond ? (pass++, cur.pass++) : (fail++, cur.fail++);
    rows.push({ g: cur.name, name: name, got: cond ? 'sí' : 'no', want: 'sí', ok: !!cond, ref: ref || '' });
  }

  /* --- utilidades para armar diagramas de prueba --- */
  function P0() { return MODEL.newProject('autodiagnóstico'); }
  function st(r, o) { return Object.assign(MODEL.newBlock({ isStatic: true, staticR: r }), o || {}); }
  function nf(o) { return Object.assign(MODEL.newBlock({ canFail: false }), o || {}); }
  function mk(P, els, links) {
    var D = MODEL.newDiagram('d' + P.diagrams.length);
    els.forEach(function (e) { D.elements.push(e); });
    (links || []).forEach(function (l) { D.links.push({ from: l[0].id, to: l[1].id }); });
    P.diagrams.push(D); return D;
  }
  function R(P, D, t) { return new BS.System(P, D.id).R(t == null ? 1 : t); }
  function comb(n, k) { var r = 1; for (var i = 0; i < k; i++) r = r * (n - i) / (i + 1); return r; }
  function kofn(n, k, r) { var s = 0; for (var i = k; i <= n; i++) s += comb(n, i) * Math.pow(r, i) * Math.pow(1 - r, n - i); return s; }

  /* ---------- 1. Configuraciones básicas ---------- */
  g('Configuraciones básicas');
  (function () {
    var P = P0(), a = st(0.9), b = st(0.8), c = st(0.7);
    mk(P, [a, b, c], [[a, b], [b, c]]);
    chk('Serie de 3: Rs = R₁·R₂·R₃', R(P, P.diagrams[0]), 0.504, 1e-12, '0,9·0,8·0,7');
  })();
  (function () {
    var P = P0(), s = nf(), a = st(0.9), b = st(0.8), c = st(0.7), e = nf();
    mk(P, [s, a, b, c, e], [[s, a], [s, b], [s, c], [a, e], [b, e], [c, e]]);
    chk('Paralelo de 3: Rs = 1 − Π(1−Rᵢ)', R(P, P.diagrams[0]), 0.994, 1e-12, '1 − 0,1·0,2·0,3');
  })();
  (function () {
    [[4, 3, 0.9], [5, 3, 0.8], [6, 4, 0.6], [3, 1, 0.5]].forEach(function (q) {
      var n = q[0], k = q[1], r = q[2], P = P0(), s = nf(), nd = MODEL.newNode({ k: k }), us = [];
      for (var i = 0; i < n; i++) us.push(st(r));
      mk(P, [s].concat(us, [nd]), us.map(function (u) { return [s, u]; }).concat(us.map(function (u) { return [u, nd]; })));
      chk(k + ' de ' + n + ' con Rᵢ = ' + fmt(r, 2), R(P, P.diagrams[0]), kofn(n, k, r), 1e-12, 'binomial');
    });
  })();
  (function () {
    // Puente dirigido de 5 componentes contra enumeración de los 32 estados
    var rr = [0.9, 0.85, 0.8, 0.75, 0.95], want = 0;
    for (var m = 0; m < 32; m++) {
      var p = 1, s = [];
      for (var j = 0; j < 5; j++) { var on = !!(m & (1 << j)); s.push(on); p *= on ? rr[j] : 1 - rr[j]; }
      if ((s[0] && s[2]) || (s[1] && s[3]) || (s[0] && s[4] && s[3])) want += p;
    }
    var P = P0(), ss = nf(), J1 = nf(), J2 = nf(), f = nf();
    var A = st(rr[0]), B = st(rr[1]), C = st(rr[2]), D2 = st(rr[3]), E = st(rr[4]);
    mk(P, [ss, A, B, J1, J2, E, C, D2, f],
      [[ss, A], [ss, B], [A, J1], [B, J2], [J1, E], [E, J2], [J1, C], [J2, D2], [C, f], [D2, f]]);
    chk('Puente de 5 componentes', R(P, P.diagrams[0]), want, 1e-12, 'enumeración de 32 estados');
  })();

  /* ---------- 2. Distribuciones ---------- */
  g('Distribuciones');
  (function () {
    var d = { type: 'exponential', lambda: 1 / 500, gamma: 0 };
    chk('Exponencial R(0) = 1', BS.distR(d, 0), 1, 1e-12);
    chk('Exponencial R(1/λ) = e⁻¹', BS.distR(d, 500), Math.exp(-1), 1e-12, '0,367879');
    chk('Exponencial media = 1/λ', BS.distMean(d), 500, 1e-9);
    chk('Exponencial sin memoria', BS.distR(d, 800) / BS.distR(d, 300), BS.distR(d, 500), 1e-12);
  })();
  (function () {
    [0.5, 1, 2, 3.5].forEach(function (b) {
      var d = { type: 'weibull', beta: b, eta: 1000, gamma: 0 };
      chk('Weibull β=' + b + ': R(η) = e⁻¹', BS.distR(d, 1000), Math.exp(-1), 1e-12);
      chk('Weibull β=' + b + ': media = η·Γ(1+1/β)', BS.distMean(d), 1000 * BS.gammaFn(1 + 1 / b), 1e-6);
    });
    chk('Weibull β=1 ≡ exponencial', BS.distR({ type: 'weibull', beta: 1, eta: 500, gamma: 0 }, 777),
      BS.distR({ type: 'exponential', lambda: 1 / 500, gamma: 0 }, 777), 1e-12);
    chk('Weibull 3P: R(t) = 1 antes de γ', BS.distR({ type: 'weibull', beta: 2, eta: 100, gamma: 50 }, 30), 1, 1e-12);
  })();
  (function () {
    var d = { type: 'normal', mu: 1000, sigma: 120 };
    chk('Normal R(μ) = 0,5', BS.distR(d, 1000), 0.5, 1e-9);
    chk('Normal R(μ+σ) = 0,158655', BS.distR(d, 1120), 0.15865525, 1e-7, 'tabla normal');
    chk('Normal R(μ−1,96σ) = 0,975', BS.distR(d, 1000 - 1.959964 * 120), 0.975, 1e-6, 'tabla normal');
    var l = { type: 'lognormal', mu: 6, sigma: 0.8 };
    chk('Lognormal R(e^μ′) = 0,5', BS.distR(l, Math.exp(6)), 0.5, 1e-9);
    chk('Lognormal media = exp(μ′+σ′²/2)', BS.distMean(l), Math.exp(6.32), 1e-4);
  })();
  (function () {
    var d = { type: 'mixweibull', subs: [{ beta: 1.2, eta: 400, p: 0.3 }, { beta: 3, eta: 1200, p: 0.7 }] };
    var man = 0.3 * Math.exp(-Math.pow(1.5, 1.2)) + 0.7 * Math.exp(-Math.pow(0.5, 3));
    chk('Weibull mixta: combinación convexa', BS.distR(d, 600), man, 1e-12);
  })();
  (function () {
    // f(t) debe ser la derivada de F(t)
    [{ type: 'weibull', beta: 2.2, eta: 800, gamma: 0 }, { type: 'lognormal', mu: 6, sigma: 0.6 }].forEach(function (d, i) {
      var t = BS.distMean(d), e = t * 1e-5;
      chk('f(t) = −dR/dt (distribución ' + (i + 1) + ')', BS.distPdf(d, t),
        (BS.distR(d, t - e) - BS.distR(d, t + e)) / (2 * e), 1e-6, 'derivada numérica');
    });
  })();

  /* ---------- 3. Métricas del sistema ---------- */
  g('Métricas del sistema');
  (function () {
    var P = P0(),
      b1 = MODEL.newBlock({ failure: { type: 'exponential', lambda: 1 / 1000, gamma: 0 } }),
      b2 = MODEL.newBlock({ failure: { type: 'exponential', lambda: 1 / 500, gamma: 0 } }),
      b3 = MODEL.newBlock({ failure: { type: 'exponential', lambda: 3 / 1000, gamma: 0 } });
    mk(P, [b1, b2, b3], [[b1, b2], [b2, b3]]);
    var S = new BS.System(P, P.diagrams[0].id), lam = 0.006;
    chk('Serie exponencial R(50) = 0,7408', S.R(50), Math.exp(-0.3), 1e-9, 'guía BlockSim');
    chk('Serie exponencial λ(t) = Σλᵢ', S.h(123), lam, 1e-7);
    chk('Serie exponencial MTTF = 1/Σλ', S.mttf(), 1 / lam, 0.2);
  })();
  (function () {
    var lam = 1 / 200, P = P0(), s = nf(),
      a = MODEL.newBlock({ failure: { type: 'exponential', lambda: lam, gamma: 0 } }),
      b = MODEL.newBlock({ failure: { type: 'exponential', lambda: lam, gamma: 0 } }), e = nf();
    mk(P, [s, a, b, e], [[s, a], [s, b], [a, e], [b, e]]);
    chk('Paralelo 2 exponencial: MTTF = 1,5/λ', new BS.System(P, P.diagrams[0].id).mttf(), 1.5 / lam, 0.3);
  })();
  (function () {
    var P = P0(), a = MODEL.newBlock({ failure: { type: 'weibull', beta: 2.5, eta: 900, gamma: 0 } });
    mk(P, [a], []);
    var S = new BS.System(P, P.diagrams[0].id);
    chk('MTTF Weibull = η·Γ(1+1/β)', S.mttf(), 900 * BS.gammaFn(1.4), 0.5);
    chk('R(t|T) = R(T+t)/R(T)', S.condR(200, 300), S.R(500) / S.R(300), 1e-10);
    chk('timeForR(0,9) devuelve R = 0,9', S.R(S.timeForR(0.9)), 0.9, 1e-7);
    chk('Vida B10 (fórmula cerrada Weibull)', S.bx(10), 900 * Math.pow(-Math.log(0.9), 0.4), 1e-4);
  })();

  /* ---------- 4. Importancia de Birnbaum ---------- */
  g('Importancia (Birnbaum)');
  (function () {
    var P = P0(), a = st(0.9), b = st(0.8), c = st(0.7);
    mk(P, [a, b, c], [[a, b], [b, c]]);
    var imp = new BS.System(P, P.diagrams[0].id).importance(1);
    chk('Serie: I₁ = R₂·R₃', imp[0], 0.56, 1e-12);
    chk('Serie: I₃ = R₁·R₂', imp[2], 0.72, 1e-12);
  })();
  (function () {
    var P = P0(), s = nf(), a = st(0.9), b = st(0.8), c = st(0.7), e = nf();
    mk(P, [s, a, b, c, e], [[s, a], [s, b], [s, c], [a, e], [b, e], [c, e]]);
    var imp = new BS.System(P, P.diagrams[0].id).importance(1);
    chk('Paralelo: I₁ = (1−R₂)(1−R₃)', imp[0], 0.06, 1e-12);
    chk('Paralelo: I₃ = (1−R₁)(1−R₂)', imp[2], 0.02, 1e-12);
  })();
  (function () {
    var P = P0(), s = nf(), a = st(0.82), b = st(0.64), nd = MODEL.newNode({ k: 2 }), c = st(0.91), d = st(0.55);
    mk(P, [s, a, b, c, d, nd], [[s, a], [s, b], [s, c], [a, nd], [b, nd], [c, nd], [nd, d]]);
    var S = new BS.System(P, P.diagrams[0].id), imp = S.importance(1), p = S.compR(1), lin = true;
    for (var i = 0; i < imp.length; i++) {
      var hi = p.slice(), lo = p.slice(); hi[i] = 1; lo[i] = 0;
      if (Math.abs((S.Rp(hi) - S.Rp(lo)) - imp[i]) > 1e-12) lin = false;
    }
    chkT('Rs es lineal en cada Rᵢ (pendiente = importancia)', lin);
    var h0 = p.slice(), l0 = p.slice(); h0[0] = 1; l0[0] = 0;
    chk('Descomposición pivotal de Shannon', p[0] * S.Rp(h0) + (1 - p[0]) * S.Rp(l0), S.R(1), 1e-12);
  })();

  /* ---------- 5. Fraccionamiento ---------- */
  g('Fraccionamiento');
  function frac(caps, dem, r) {
    var P = P0(), s = nf(), nd = MODEL.newNode({ k: 1, redund: 'fraction', demand: dem }), us = [];
    caps.forEach(function (c) { us.push(st(r, { cap: c })); });
    mk(P, [s].concat(us, [nd]), us.map(function (u) { return [s, u]; }).concat(us.map(function (u) { return [u, nd]; })));
    return new BS.System(P, P.diagrams[0].id);
  }
  (function () {
    chk('3 × 33,33 % con demanda 100 → E = 0,75', frac([100 / 3, 100 / 3, 100 / 3], 100, 0.75).R(1), 0.75, 1e-12, 'ΣRᵢLᵢ + (1−ΣLᵢ)ΠRᵢ');
    chk('3 × 40 % con demanda 100 → E = 0,815625', frac([40, 40, 40], 100, 0.75).R(1), 0.815625, 1e-9, 'Σ P(estado)·mín(cap,D)/D');
    var S = frac([50, 50], 0, 0.9);
    chk('Demanda vacía usa la suma de capacidades', S.R(1), 0.81 + 2 * 0.09 * 0.5, 1e-12);
    chkT('detail() expande el grupo en sus unidades', frac([40, 40, 40], 100, 0.75).detail(1).length === 3);
    var e = 1e-6, num = (frac([40, 40, 40], 100, 0.75 + e).R(1) - frac([40, 40, 40], 100, 0.75 - e).R(1)) / (2 * e);
    var sum = frac([40, 40, 40], 100, 0.75).detail(1).reduce(function (a, d) { return a + d.imp; }, 0);
    chk('Σ∂E/∂Rᵢ coincide con la derivada numérica', sum, num, 1e-5);
  })();

  /* ---------- 6. Tabla COPT ---------- */
  g('Tabla COPT');
  (function () {
    var P = P0(), s = nf(), nd = MODEL.newNode({ k: 2 }), us = [];
    for (var i = 0; i < 3; i++) us.push(st(0.9, { cap: 50 }));
    var D = mk(P, [s].concat(us, [nd]), us.map(function (u) { return [s, u]; }).concat(us.map(function (u) { return [u, nd]; })));
    var r = BS.copt(P, D.id, nd.id, 'rel', 1, 100);
    chk('Las probabilidades de los estados suman 1', r.levels.reduce(function (a, l) { return a + l.p; }, 0), 1, 1e-12);
    chk('Capacidad media = n·R·capacidad', r.meanCap, 135, 1e-9);
    chk('P(cumplir 2 de 3) coincide con la binomial', r.okProb, kofn(3, 2, 0.9), 1e-12);
    chk('Probabilidad acumulada final = 1', r.levels[r.levels.length - 1].cumGE, 1, 1e-12);
    var mono = true, prev = Infinity;
    r.levels.forEach(function (l) { if (l.cap > prev) mono = false; prev = l.cap; });
    chkT('Niveles ordenados de mayor a menor capacidad', mono);
  })();
  (function () {
    var P = P0(), s = nf(), nd = MODEL.newNode({ k: 1 }), us = [];
    for (var i = 0; i < 2; i++) us.push(MODEL.newBlock({
      failure: { type: 'exponential', lambda: 1 / 1000, gamma: 0 },
      canRepair: true, repair: { type: 'exponential', lambda: 1 / 50, gamma: 0 }, cap: 10
    }));
    var D = mk(P, [s].concat(us, [nd]), us.map(function (u) { return [s, u]; }).concat(us.map(function (u) { return [u, nd]; })));
    var r = BS.copt(P, D.id, nd.id, 'avail', 0, 0);
    chk('Base disponibilidad: p = MTTF/(MTTF+MTTR)', r.units[0].p, 1000 / 1050, 1e-12, '0,952381');
  })();

  /* ---------- 7. Subdiagramas ---------- */
  g('Subdiagramas');
  (function () {
    var P = P0(), s2 = nf(), a = st(0.8), b = st(0.7), e2 = nf();
    var Dsub = mk(P, [s2, a, b, e2], [[s2, a], [s2, b], [a, e2], [b, e2]]);
    var sub = MODEL.newBlock({ asDiagram: true, subId: Dsub.id }), c = st(0.95);
    var Dm = mk(P, [sub, c], [[sub, c]]);
    chk('Subdiagrama (A∥B) en serie con C', R(P, Dm), 0.94 * 0.95, 1e-12);
    var s1 = MODEL.newBlock({ asDiagram: true, subId: Dsub.id }), s3 = MODEL.newBlock({ asDiagram: true, subId: Dsub.id });
    var D3 = mk(P, [s1, s3], [[s1, s3]]);
    chk('Dos instancias del mismo subdiagrama', R(P, D3), 0.94 * 0.94, 1e-12);
  })();

  /* ---------- 8. Consistencia y casos límite ---------- */
  g('Consistencia y casos límite');
  (function () {
    var P = P0(), s = nf(), a = st(0.9), b = st(0.8), nd = MODEL.newNode({ k: 2 }), c = st(0.7);
    mk(P, [s, a, b, c, nd], [[s, a], [s, b], [s, c], [a, nd], [b, nd], [c, nd]]);
    var S = new BS.System(P, P.diagrams[0].id);
    chk('Rs = 1 si todos los componentes funcionan', S.Rp(S.comps.map(function () { return 1; })), 1, 1e-12);
    chk('Rs = 0 si todos fallan', S.Rp(S.comps.map(function () { return 0; })), 0, 1e-12);
    var base = S.compR(1), mono = true;
    for (var i = 0; i < base.length; i++) {
      var up = base.slice(); up[i] = Math.min(1, base[i] + 0.05);
      if (S.Rp(up) < S.Rp(base) - 1e-12) mono = false;
    }
    chkT('Rs nunca baja al mejorar un componente', mono);
  })();
  (function () {
    var P = P0(),
      q1 = MODEL.newBlock({ failure: { type: 'weibull', beta: 0.7, eta: 300, gamma: 0 } }),
      q2 = MODEL.newBlock({ failure: { type: 'lognormal', mu: 6, sigma: 0.9 } });
    mk(P, [q1, q2], [[q1, q2]]);
    var S = new BS.System(P, P.diagrams[0].id), rango = true, decr = true, prev = 1.0000001;
    for (var t = 0; t <= 5000; t += 50) {
      var r = S.R(t);
      if (!(r >= -1e-12 && r <= 1 + 1e-12)) rango = false;
      if (r > prev + 1e-9) decr = false;
      prev = r;
    }
    chkT('Rs(t) se mantiene entre 0 y 1', rango);
    chkT('Rs(t) es no creciente en el tiempo', decr);
    chk('Rs(0) = 1', S.R(0), 1, 1e-12);
  })();
  (function () {
    var P = P0(), s = nf(), a = st(0.9), b = st(0.8, { active: false }), e = nf();
    mk(P, [s, a, b, e], [[s, a], [s, b], [a, e], [b, e]]);
    chk('Un bloque desactivado se trata como fallado', R(P, P.diagrams[0]), 0.9, 1e-12);
    var P2 = P0(), s2 = nf(), c = st(0.9), d = st(0.9), nd = MODEL.newNode({ k: 3 });
    mk(P2, [s2, c, d, nd], [[s2, c], [s2, d], [c, nd], [d, nd]]);
    chk('k mayor que n → Rs = 0', R(P2, P2.diagrams[0]), 0, 1e-12);
  })();
  (function () {
    var P = P0(), a = st(0.9), b = st(0.9);
    var D = mk(P, [a, b], [[a, b], [b, a]]);
    chkT('Detecta ciclos en el diagrama', !!BS.compile(D).error);
    var P2 = P0(), D1 = mk(P2, [], []), D2 = mk(P2, [], []);
    D1.elements.push(MODEL.newBlock({ asDiagram: true, subId: D2.id }));
    D2.elements.push(MODEL.newBlock({ asDiagram: true, subId: D1.id }));
    var threw = false;
    try { new BS.System(P2, D1.id); } catch (e) { threw = true; }
    chkT('Detecta subdiagramas con referencia circular', threw);
    var P3 = P0(), s = nf(), nd = MODEL.newNode({ k: 1, redund: 'fraction', demand: 100 }), u = st(0.9, { cap: 100 });
    mk(P3, [s, u, nd], [[s, u], [u, nd]]);
    var t2 = false;
    try { new BS.System(P3, P3.diagrams[0].id); } catch (e) { t2 = true; }
    chkT('Rechaza fraccionamiento con una sola unidad', t2);
  })();

  /* ---------- 9. Simulación Montecarlo ---------- */
  if (!quick) {
    g('Simulación Montecarlo');
    (function () {
      var P = P0(),
        a = MODEL.newBlock({ failure: { type: 'weibull', beta: 2, eta: 800, gamma: 0 } }),
        b = MODEL.newBlock({ failure: { type: 'weibull', beta: 1.4, eta: 1200, gamma: 0 } });
      var D = mk(P, [a, b], [[a, b]]);
      var exact = new BS.System(P, D.id).R(500);
      var r = BS.simReliability(P, D.id, { endTime: 1000, inc: 100, outer: 8, inner: 2500, useSeed: true, seed: 12345 });
      var row = r.rows.filter(function (x) { return Math.abs(x.t - 500) < 1e-9; })[0];
      chk('Serie Weibull: simulación ≈ cálculo exacto', row.R, exact, 0.012, 'exacto = ' + fmt(exact, 4) + ' · 20 000 corridas');
    })();
    (function () {
      var lam = 1 / 1000, P = P0(), s = nf(), nd = MODEL.newNode({ k: 1, redund: 'standby', dorm: 0, pSwitch: 1 }), us = [];
      for (var i = 0; i < 2; i++) us.push(MODEL.newBlock({ failure: { type: 'exponential', lambda: lam, gamma: 0 }, y: i * 100 }));
      var D = mk(P, [s].concat(us, [nd]), us.map(function (u) { return [s, u]; }).concat(us.map(function (u) { return [u, nd]; })));
      var r = BS.simReliability(P, D.id, { endTime: 1500, inc: 100, outer: 8, inner: 3000, useSeed: true, seed: 2024 });
      var row = r.rows.filter(function (x) { return Math.abs(x.t - 1000) < 1e-9; })[0];
      chk('Reserva fría 1 de 2: R = e⁻ᵗ/ᵐ(1+t/m)', row.R, 2 * Math.exp(-1), 0.015, 'teórico = 0,7358');
    })();
    (function () {
      var P = P0(), a = MODEL.newBlock({
        failure: { type: 'exponential', lambda: 1 / 500, gamma: 0 },
        canRepair: true, repair: { type: 'exponential', lambda: 1 / 25, gamma: 0 }
      });
      var D = mk(P, [a], []);
      var r = BS.simMaintainability(P, D.id, { endTime: 100000, inc: 20000, outer: 3, inner: 40, useSeed: true, seed: 31337 });
      chk('Disponibilidad = MTTF/(MTTF+MTTR)', r.system.meanA, 500 / 525, 0.008, 'teórico = 0,952381');
    })();
    (function () {
      var P = P0(), a = MODEL.newBlock({ failure: { type: 'weibull', beta: 2, eta: 500, gamma: 0 } });
      var D = mk(P, [a], []);
      var o = { endTime: 800, inc: 200, outer: 4, inner: 400, useSeed: true, seed: 42 };
      var r1 = BS.simReliability(P, D.id, o), r2 = BS.simReliability(P, D.id, o);
      chkT('La misma semilla da el mismo resultado', r1.rows.every(function (x, i) { return x.R === r2.rows[i].R; }));
    })();

    /* ---------- 9b. Logística: repuestos, cuadrillas, demoras, PM, conmutación ---------- */
    g('Logística (repuestos, cuadrillas, mantención)');
    var ex = function (m) { return { type: 'exponential', lambda: 1 / m, gamma: 0 }; }, fx = function (v) { return { kind: 'fixed', value: v }; };
    var oo = function (end, n, seed) { return { endTime: end, inc: end, outer: 4, inner: n / 4, useSeed: true, seed: seed }; };
    (function () {
      var P = P0(); P.crews = [{ id: 'c1', name: 'C', count: 1 }];
      var s = nf(), nd = MODEL.newNode({ k: 1 }), us = [0, 1, 2].map(function () { return MODEL.newBlock({ failure: ex(100), canRepair: true, repair: ex(20), logi: { crew: 'c1' } }); });
      var D = mk(P, [s].concat(us, [nd]), us.map(function (u) { return [s, u]; }).concat(us.map(function (u) { return [u, nd]; })));
      var r = BS.simMaintainability(P, D.id, oo(200000, 40, 11)), w = [1, 0.6, 0.24, 0.048], S = 1.888;
      chk('Reparador único, 1 de 3: A = 1 − p₃ (fuente finita)', r.system.meanA, 1 - w[3] / S, 0.004, 'teórico = 0,974576');
      chk('Reparador único: utilización = 1 − p₀', r.crews[0].util, 1 - w[0] / S, 0.006, 'teórico = 0,470339');
    })();
    (function () {
      var P = P0(); P.pools = [{ id: 'p1', name: 'R', stock: 0, lead: fx(200) }];
      var a = MODEL.newBlock({ failure: ex(1000), canRepair: true, repair: ex(50), logi: { pool: 'p1' } });
      var D = mk(P, [a], []), r = BS.simMaintainability(P, D.id, oo(400000, 40, 12));
      chk('Sin stock, plazo 200: A = m/(m + plazo + MTTR)', r.system.meanA, 0.8, 0.006, '1000/1250');
      chk('Sin stock: MDT = plazo + MTTR', r.system.mdt, 250, 6, '250');
    })();
    (function () {
      var P = P0(); P.pools = [{ id: 'p1', name: 'R', stock: 1, lead: fx(500) }];
      var a = MODEL.newBlock({ failure: ex(1000), canRepair: true, repair: ex(1e-6), logi: { pool: 'p1' } });
      var D = mk(P, [a], []), r = BS.simMaintainability(P, D.id, oo(400000, 40, 13));
      var W = 0, sW = 0, z = 0, n = 400000, rg = BS.mulberry32(99);
      for (var i = 0; i < n; i++) { var X = -1000 * Math.log(1 - rg()); W = Math.max(0, 500 - W - X); sW += W; if (W === 0) z++; }
      chk('Stock 1, uno por uno: A = E[X]/(E[X]+E[W])', r.system.meanA, 1000 / (1000 + sW / n), 0.006, 'recurrencia W = (L − W − X)⁺');
      chk('Stock 1: tasa de llenado = P(W = 0)', r.pools[0].fill, z / n, 0.02, 'recurrencia independiente');
    })();
    (function () {
      var P = P0(), a = MODEL.newBlock({ failure: ex(1000), canRepair: true, repair: ex(50), logi: { delayOn: true, delay: { kind: 'dist', dist: ex(100) } } });
      var D = mk(P, [a], []), r = BS.simMaintainability(P, D.id, oo(400000, 40, 14));
      chk('Demora logística media 100: A = 1000/1150', r.system.meanA, 1000 / 1150, 0.006, '0,869565');
    })();
    (function () {
      var P = P0(), a = MODEL.newBlock({ failure: ex(1e15), canRepair: true, repair: ex(1), logi: { pm: { on: true, interval: 1000, first: 1000, dur: fx(50) } } });
      var D = mk(P, [a], []), r = BS.simMaintainability(P, D.id, { endTime: 10500, inc: 10500, outer: 1, inner: 5, useSeed: true, seed: 1 });
      chk('PM 50 cada 1000 en 10 500: A = 1 − 500/10 500', r.system.meanA, 1 - 500 / 10500, 1e-9, 'determinístico');
      chk('PM: 10 mantenciones en el período', r.blocks[0].nom, 10, 1e-12);
    })();
    (function () {
      var P = P0(), s = nf(), nd = MODEL.newNode({ k: 1, redund: 'standby', dorm: 0, pSwitch: 1, tSwitch: 2 });
      var us = [0, 1].map(function (i) { return MODEL.newBlock({ failure: ex(100), canRepair: true, repair: ex(1e-6), y: i * 100 }); });
      var D = mk(P, [s].concat(us, [nd]), us.map(function (u) { return [s, u]; }).concat(us.map(function (u) { return [u, nd]; })));
      var r = BS.simMaintainability(P, D.id, oo(200000, 40, 15));
      chk('Conmutación de 2: A = m/(m + t_conm)', r.system.meanA, 100 / 102, 0.003, '0,980392');
      chk('Conmutación: MDT = t_conm', r.system.mdt, 2, 1e-3);
    })();

    /* ---------- 10. Ajuste MLE ---------- */
    g('Ajuste de distribución (MLE)');
    (function () {
      var rng = BS.mulberry32(20260101), rows2 = [], tru = { type: 'weibull', beta: 2, eta: 1000, gamma: 0 };
      for (var i = 0; i < 300; i++) rows2.push({ n: 1, state: 'F', t: BS.distSample(tru, rng), t0: 0 });
      var r = BS.fitAll(rows2, false), w2 = (r.results || []).filter(function (x) { return x.key === 'weib2'; })[0];
      chkT('El ajuste devuelve resultados ordenados por AIC', !r.error && r.results && r.results.length > 0);
      if (w2) {
        chk('Recupera β = 2 de 300 datos simulados', w2.dist.beta, 2, 0.2, 'tolerancia ±10 %');
        chk('Recupera η = 1000 de 300 datos simulados', w2.dist.eta, 1000, 60, 'tolerancia ±6 %');
      } else chkT('Weibull 2P entre los ajustes', false);
      chkT('El mejor ajuste por AIC es una Weibull', !!(r.results && r.results[0] && /Weibull/.test(r.results[0].name)),
        r.results && r.results[0] ? r.results[0].name : '');
    })();
    (function () {
      var r = BS.fitAll([
        { n: 1, state: 'F', t: 100, t0: 0 }, { n: 1, state: 'F', t: 200, t0: 0 },
        { n: 1, state: 'F', t: 350, t0: 0 }, { n: 1, state: 'S', t: 400, t0: 0 },
        { n: 1, state: 'S', t: 500, t0: 0 }
      ], false);
      var e1 = (r.results || []).filter(function (x) { return x.key === 'exp1'; })[0];
      if (e1) chk('Exponencial censurada: λ = n fallas / Σt', e1.dist.lambda, 3 / 1550, 1e-5, 'estimador cerrado');
      else chkT('Exponencial 1P entre los ajustes', false);
      var km = BS.kaplanMeier(BS.prepData([
        { n: 1, state: 'F', t: 10, t0: 0 }, { n: 1, state: 'F', t: 20, t0: 0 },
        { n: 1, state: 'F', t: 30, t0: 0 }, { n: 1, state: 'F', t: 40, t0: 0 }
      ], false));
      chk('Kaplan–Meier: R tras la 1.ª de 4 fallas = 0,75', km[1].R, 0.75, 1e-12);
      chk('Kaplan–Meier: R tras la 2.ª = 0,50', km[2].R, 0.5, 1e-12);
    })();
  }

  /* ---------- 11. Ejemplos incluidos ---------- */
  g('Ejemplos incluidos');
  (function () {
    var Pr = MODEL.EX.rapido();
    chk('Ejemplo rápido: R(50) = 0,7408', new BS.System(Pr, Pr.diagrams[0].id).R(50), 0.7408, 5e-5, 'guía BlockSim 1.0');
    var bad = [];
    MODEL.EXAMPLES.forEach(function (ex) {
      var Pj;
      try { Pj = MODEL.EX[ex.key](); } catch (e) { bad.push(ex.key + ': no construye'); return; }
      Pj.diagrams.forEach(function (d) {
        try {
          var r = new BS.System(Pj, d.id).R(100);
          if (!(r >= -1e-9 && r <= 1 + 1e-9)) bad.push(ex.key + '/' + d.name);
        } catch (e) {
          if (!/espera|standby/i.test(e.message)) bad.push(ex.key + '/' + d.name + ': ' + e.message);
        }
      });
    });
    chkT('Los ' + MODEL.EXAMPLES.length + ' ejemplos cargan y dan Rs válido', bad.length === 0, bad.join(' · '));
  })();

  return { groups: groups, rows: rows, pass: pass, fail: fail };
}

function cmdSelfTest() {
  var box = h('div', { class: 'stack' },
    h('p', null, 'Se comprobará el motor de cálculo contra resultados analíticos conocidos: fórmulas cerradas de serie, paralelo y k-de-n, las distribuciones contra sus valores de tabla, la importancia contra la derivada, la simulación contra el cálculo exacto, la logística (repuestos, cuadrillas, mantención) contra resultados de colas e inventario, y el ajuste MLE contra datos de parámetros conocidos.'),
    h('p', { class: 'muted small' }, 'Tarda unos segundos. No modifica tu proyecto.'));
  openModal({
    title: 'Verificar el programa', body: box,
    buttons: [{ label: 'Cancelar' }, {
      label: 'Ejecutar comprobaciones', primary: true, onClick: function (close) {
        close();
        var prog = openModal({
          title: 'Verificando…', dismiss: false,
          body: h('div', { class: 'progress' }, h('div', { class: 'bar' }), h('span', null, 'Ejecutando las comprobaciones…')),
          buttons: []
        });
        setTimeout(function () {
          var r, err = null, t0 = Date.now();
          try { r = runSelfTest(false); } catch (e) { err = e; }
          var ms = Date.now() - t0;
          prog.close();
          if (err) return toast('El autodiagnóstico falló: ' + err.message, 'warn');
          showSelfTestResults(r, ms);
        }, 60);
      }
    }]
  });
}

function showSelfTestResults(r, ms) {
  var allOk = r.fail === 0;
  var secs = [
    {
      kv: [['Fecha', today()], ['Comprobaciones ejecutadas', String(r.pass + r.fail)],
      ['Correctas', String(r.pass)], ['Con diferencia', String(r.fail)],
      ['Resultado', allOk ? 'Todas las comprobaciones pasaron' : 'Hay ' + r.fail + ' comprobación(es) fuera de tolerancia'],
      ['Duración', fmt(ms / 1000, 2) + ' s']]
    },
    {
      heading: 'Resumen por área', table: {
        head: ['Área', 'Correctas', 'Total', 'Estado'],
        rows: r.groups.map(function (g) {
          return { cells: [g.name, String(g.pass), String(g.pass + g.fail), g.fail === 0 ? 'OK' : 'Revisar'], cls: g.fail ? 'hl' : '' };
        })
      }
    }
  ];
  if (r.fail) {
    secs.push({
      heading: 'Comprobaciones fuera de tolerancia', table: {
        head: ['Área', 'Comprobación', 'Obtenido', 'Esperado'],
        rows: r.rows.filter(function (x) { return !x.ok; }).map(function (x) {
          return { cells: [x.g, x.name, String(x.got), String(x.want)], cls: 'hl' };
        })
      }
    });
    secs.push({ text: 'Una diferencia aquí indica que el motor se apartó de un resultado conocido. Anota la fila y repórtala antes de usar el programa para decisiones.', cls: 'warn-text' });
  }
  secs.push({
    heading: 'Detalle completo', table: {
      head: ['Área', 'Comprobación', 'Obtenido', 'Esperado', 'Referencia', ''],
      rows: r.rows.map(function (x) {
        var fnum = function (v) { return typeof v === 'number' ? fmt(v, 6) : String(v); };
        return { cells: [x.g, x.name, fnum(x.got), fnum(x.want), x.ref, x.ok ? 'OK' : 'Revisar'], cls: x.ok ? '' : 'hl' };
      })
    }
  });
  secs.push({
    text: 'Qué significa este informe: cada fila compara el motor contra un valor que se conoce por otra vía — una fórmula cerrada de la teoría de confiabilidad, un valor de tabla estadística, una derivada numérica o un parámetro con el que se generaron datos simulados. ' +
      'Que pasen todas no demuestra que el programa esté libre de errores; demuestra que en estos casos coincide con el resultado correcto. Para tus propios cálculos, la verificación que más vale es reproducir a mano un caso sencillo de tu sistema y compararlo.'
  });
  showResults('Verificación del programa — ' + (allOk ? r.pass + ' de ' + r.pass + ' correctas' : r.fail + ' diferencia(s) en ' + (r.pass + r.fail) + ' comprobaciones'), secs, { xwide: true });
}

init();
})();
</script>
